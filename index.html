    if(t.actif) return;
    if(t.etat==='Cassé') casses++;
    else if(t.etat==='Usé') uses++;
    else if(t.etat==='Manquant') manquants++;
  });
  const mesEnAttente = mouvementsAllCache.filter(m=>m.servanteId===s.id && !m.valideParAgent).length
                      + inventairesAllCache.filter(i=>i.servanteId===s.id && !i.valideParAgent).length;
  const due = getNextInventoryDue(s);
  const status = inventoryStatus(due.date);

  main.innerHTML = `
    <div class="page-head"><div><h2>Tableau de bord</h2><p class="sub">Résumé de votre servante</p></div></div>
    ${status.level==='retard' ? `
      <div class="panel" style="border-color:var(--red);background:var(--red-pale);padding:12px 16px;margin-bottom:20px;">
        <b style="color:var(--red);">⚠ Inventaire en retard</b> — ${status.label}
      </div>` : ''}
    <div class="dash-grid">
      ${tile(outilsActifs.length, 'Outils en dotation')}
      ${tile(casses, 'Outils cassés (historique)', casses ? 'accent-red' : '')}
      ${tile(uses, 'Outils usés (historique)', uses ? 'accent-amber' : '')}
      ${tile(manquants, 'Outils manquants (historique)', manquants ? 'accent-red' : '')}
      ${tile(mesEnAttente, 'En attente de ma validation', mesEnAttente ? 'accent-amber' : '')}
      ${tile(s.dernierInventaire ? formatDate(s.dernierInventaire.date).split(' à ')[0] : '—', 'Dernier inventaire')}
    </div>
    <div class="section-label">Prochain inventaire</div>
    <div class="panel" style="padding:16px 20px;">
      ${inventoryStatusPill(s)}
    </div>
  `;
}

function renderServantesView(){
  const main = document.getElementById('main-content');
  document.getElementById('mobile-header-title').textContent = 'Servantes';
  const rows = servantesCache.slice().sort((a,b)=> (a.agentNom||'').localeCompare(b.agentNom||''));
  main.innerHTML = `
    <div class="page-head">
      <div><h2>Servantes</h2><p class="sub">${rows.length} servante${rows.length>1?'s':''} suivie${rows.length>1?'s':''}</p></div>
      <div class="page-head-actions">
        ${hasPermission('servantesCreer') ? `<button class="btn btn-primary" id="btn-new-servante">+ Nouvelle servante</button>` : ''}
      </div>
    </div>
    <div class="toolbar">
      <input type="text" id="servantes-search" placeholder="Rechercher par agent, matricule, garage…">
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Agent</th><th>Matricule</th><th>Garage</th><th>Outils</th><th>Cassés</th><th>Usés</th><th>Prochain inventaire</th><th></th>
          </tr></thead>
          <tbody id="servantes-tbody"></tbody>
        </table>
      </div>
      <div id="servantes-empty" class="empty-state" style="display:none;"><p>Aucune servante ne correspond à la recherche.</p></div>
    </div>
  `;
  function draw(filter=''){
    const f = filter.trim().toLowerCase();
    const filtered = rows.filter(s => !f || [s.agentNom, s.agentMatricule, s.garage].join(' ').toLowerCase().includes(f));
    document.getElementById('servantes-tbody').innerHTML = filtered.map(s=>{
      const outils = (s.outilsAssignes||[]).filter(t=>t.actif);
      const nbCasse = outils.filter(t=>t.etat==='Cassé').length;
      const nbUse = outils.filter(t=>t.etat==='Usé').length;
      return `
      <tr>
        <td>${s.agentMatricule ? `<b>${escapeHtml(s.agentNom||'—')}</b>` : `<span class="pill pill-amber"><span class="pill-dot"></span>Disponible</span>`}</td>
        <td class="mono">${escapeHtml(s.agentMatricule||'—')}</td>
        <td>${escapeHtml(s.garage||'—')}</td>
        <td>${outils.length}</td>
        <td>${nbCasse ? `<span class="pill pill-red">${nbCasse}</span>` : '0'}</td>
        <td>${nbUse ? `<span class="pill pill-amber">${nbUse}</span>` : '0'}</td>
        <td>${inventoryStatusPill(s)}</td>
        <td><button class="btn btn-secondary btn-sm" data-open="${s.id}">Ouvrir</button></td>
      </tr>`;
    }).join('');
    document.getElementById('servantes-empty').style.display = filtered.length ? 'none' : 'block';
    document.querySelectorAll('[data-open]').forEach(b=>{
      b.addEventListener('click', ()=>{ currentServanteId = b.dataset.open; renderServanteDetail(b.dataset.open); });
    });
  }
  draw();
  document.getElementById('servantes-search').addEventListener('input', (e)=>draw(e.target.value));
  if(hasPermission('servantesCreer')) document.getElementById('btn-new-servante').addEventListener('click', openNewServanteModal);
}

function openNewServanteModal(){
  const eligible = agentsCache.filter(a => !servantesCache.some(s=>s.agentMatricule===a.matricule));
  if(!eligible.length){
    openModal(`
      <div class="modal-head"><h3>Nouvelle servante</h3><button class="modal-close" id="m-close">&times;</button></div>
      <p style="font-size:13.5px;color:var(--steel);">Tous les agents disposent déjà d'une servante. Créez d'abord un nouvel agent.</p>
      <div class="modal-actions"><button class="btn btn-secondary" id="m-cancel">Fermer</button></div>
    `);
    document.getElementById('m-close').addEventListener('click', closeModal);
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    return;
  }
  openModal(`
    <div class="modal-head"><h3>Nouvelle servante</h3><button class="modal-close" id="m-close">&times;</button></div>
    <div class="modal-error" id="sv-modal-error"></div>
    <form id="servante-form">
      <div class="field">
        <label>Agent attributaire</label>
        <select id="sv-agent" required>
          <option value="">Sélectionner un agent…</option>
          ${eligible.map(a=>`<option value="${a.matricule}">${escapeHtml(a.prenom)} ${escapeHtml(a.nom)} — ${escapeHtml(a.matricule)}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer la servante</button>
      </div>
    </form>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('servante-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('sv-modal-error');
    const matricule = document.getElementById('sv-agent').value;
    if(!matricule){ errEl.textContent = "Veuillez sélectionner un agent."; errEl.style.display='block'; return; }
    const agent = agentsCache.find(a=>a.matricule===matricule);
    try{
      const ref = await addDoc(collection(db,'servantes'), {
        agentMatricule: matricule, agentNom: `${agent.prenom} ${agent.nom}`, garage: agent.garage,
        dateCreation: nowIso(), outilsAssignes: [], dernierInventaire: null,
        historiqueAffectations: [{ agentMatricule: matricule, agentNom: `${agent.prenom} ${agent.nom}`, garage: agent.garage, dateAttribution: nowIso(), dateRetour: null }]
      });
      closeModal();
      currentServanteId = ref.id;
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  });
}

async function libererServante(servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
  if(!s.agentMatricule) return;
  showConfirmModal(
    `Retirer cette servante à ${s.agentNom} ? Tous les outils et l'historique restent intacts — la servante redevient "disponible" et pourra être attribuée à un autre agent.`,
    async ()=>{
      const historique = (s.historiqueAffectations||[]).map((h,idx,arr) =>
        idx === arr.length-1 && !h.dateRetour ? { ...h, dateRetour: nowIso(), retireParNom: `${currentUser.prenom} ${currentUser.nom}` } : h
      );
      await updateDoc(doc(db,'servantes',servanteId), {
        agentMatricule: null, agentNom: null,
        historiqueAffectations: historique
      });
      showToast("Servante libérée, elle est maintenant disponible.", 'success');
    },
    { title:'Retirer la servante', confirmLabel:'Retirer', danger:false }
  );
}

function openReattribuerServanteModal(servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);

          <option value="">Sélectionner un agent…</option>
          ${eligibles.map(a=>`<option value="${escapeHtml(a.matricule)}">${escapeHtml(a.prenom)} ${escapeHtml(a.nom)} — ${escapeHtml(a.matricule)}${a.garage?' · '+escapeHtml(a.garage):''}</option>`).join('')}

        <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Attribuer</button>
      </div>
    </form>
  `);

  document.getElementById('reatt-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('reatt-modal-error');
    const matricule = document.getElementById('reatt-agent').value;
    if(!matricule){ errEl.textContent = "Veuillez sélectionner un agent."; errEl.style.display='block'; return; }
    const agent = agentsCache.find(a=>a.matricule===matricule);
    try{
      const historique = [...(s.historiqueAffectations||[]), { agentMatricule: matricule, agentNom: `${agent.prenom} ${agent.nom}`, garage: agent.garage, dateAttribution: nowIso(), dateRetour: null }];

        agentMatricule: matricule, agentNom: `${agent.prenom} ${agent.nom}`, garage: agent.garage,
        historiqueAffectations: historique
      });
      closeModal();
      showToast(`Servante attribuée à ${agent.prenom} ${agent.nom}.`, 'success');
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  });
}

/* ============ PHOTOS D'OUTILS (Cloudinary) ============ */
const CLOUDINARY_CLOUD_NAME = "f4qguyzb";
const CLOUDINARY_UPLOAD_PRESET = "servantes_outillage";

function compressImage(file, maxDim=900, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Impossible de lire l'image."));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Fichier image invalide."));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob) reject(new Error("Échec de la compression de l'image."));
          else resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhotoToCloudinary(file){
  const compressed = await compressImage(file);
  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST', body: formData
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error("Échec de l'envoi de la photo. " + errText);
  }
  const data = await res.json();
  return data.secure_url;
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-src="${src}"]`)){ resolve(); return; }
    const el = document.createElement('script');
    el.src = src;
    el.dataset.src = src;
    el.onload = ()=>resolve();
    el.onerror = ()=>reject(new Error("Échec de chargement de " + src));
    document.head.appendChild(el);
  });
}

async function loadSheetJS(){
  if(!window.XLSX){
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  }
  return window.XLSX;
}

          if(setAsModele){
            const existing = outilsCache.find(o => o.reference.toLowerCase() === reference.toLowerCase());
            if(existing) modeleOutils.push({ outilId: existing.id, reference: existing.reference, designation: existing.designation, categorie: existing.categorie });
          }
          continue;
        }

        let cat = localCategories.find(c => c.nom.toLowerCase() === categorieNom.toLowerCase());
        if(!cat){
          cat = { id: uid(), nom: categorieNom, sousCategories: [] };
          localCategories.push(cat);
          categoriesChanged = true;
        }
        if(sousCategorieNom && !cat.sousCategories.some(s => s.nom.toLowerCase() === sousCategorieNom.toLowerCase())){
          cat.sousCategories.push({ id: uid(), nom: sousCategorieNom });
          categoriesChanged = true;
        }

        const newRef = await addDoc(collection(db,'outils'), {
          reference, designation, categorie: cat.nom, sousCategorie: sousCategorieNom || '', fabricant,
          photoUrl: null, createdAt: nowIso()
        });
        existingRefs.add(reference.toLowerCase());
        added++;
        if(setAsModele){
          modeleOutils.push({ outilId: newRef.id, reference, designation, categorie: cat.nom });
        }
      }

      if(categoriesChanged){
        await updateDoc(doc(db,'parametres','categories'), { list: localCategories });
      }

      if(setAsModele && modeleOutils.length){
        await setDoc(doc(db,'parametres','modeleDotation'), {
          outils: modeleOutils,
          updatedAt: nowIso(),
          updatedPar: `${currentUser.prenom} ${currentUser.nom}`
        });
      }

      progressEl.style.display = 'none';
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        <div class="panel" style="padding:14px 16px;">
          <p style="font-size:13.5px;margin:0 0 6px;"><b>${added}</b> outil${added>1?'s':''} importé${added>1?'s':''}</p>
          ${skippedDup ? `<p style="font-size:12.5px;color:var(--steel);margin:0 0 4px;">${skippedDup} référence${skippedDup>1?'s':''} déjà présente${skippedDup>1?'s':''}, ignorée${skippedDup>1?'s':''}</p>` : ''}
          ${skippedInvalid ? `<p style="font-size:12.5px;color:var(--red);margin:0;">${skippedInvalid} ligne${skippedInvalid>1?'s':''} incomplète${skippedInvalid>1?'s':''} (référence/désignation/catégorie manquante), ignorée${skippedInvalid>1?'s':''}</p>` : ''}
          ${setAsModele ? `<p style="font-size:12.5px;color:var(--green-dark);margin:6px 0 0;">✓ Modèle de dotation type mis à jour avec ${modeleOutils.length} outil${modeleOutils.length>1?'s':''}</p>` : ''}
        </div>`;
      startBtn.style.display = 'none';
    }catch(err){
      progressEl.style.display = 'none';
      errEl.textContent = "Erreur lors de l'import : " + err.message;
      errEl.style.display = 'block';
      startBtn.disabled = false;
    }
  });
}

/* ============ IMPORT AGENTS EN MASSE ============ */
function openImportAgentsModal(){
  openModal(`
    <div class="modal-head"><h3>Importer des agents depuis Excel</h3><button class="modal-close" id="m-close">&times;</button></div>
    <div class="modal-error" id="import-agents-error"></div>
    <p style="font-size:13px;color:var(--steel);margin-bottom:14px;">
      Colonnes attendues : Matricule, Nom, Prénom, Garage, Équipe (optionnel), Statut (optionnel, "Actif" par défaut), Rôle (optionnel, "agent" par défaut).
      Le mot de passe initial de chaque compte créé sera son matricule. Les matricules déjà existants seront ignorés.
    </p>
    <div class="field">
      <input type="file" id="import-agents-file-input" accept=".xlsx,.xls">
    </div>
    <div id="import-agents-progress" style="display:none;font-size:13px;color:var(--steel);margin-top:10px;"></div>
    <div id="import-agents-summary" style="display:none;margin-top:14px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="m-cancel">Fermer</button>
      <button type="button" class="btn btn-primary" id="import-agents-start-btn">Importer</button>
    </div>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('import-agents-start-btn').addEventListener('click', async ()=>{
    const errEl = document.getElementById('import-agents-error');
    const progressEl = document.getElementById('import-agents-progress');
    const summaryEl = document.getElementById('import-agents-summary');
    const startBtn = document.getElementById('import-agents-start-btn');
    errEl.style.display = 'none';
    summaryEl.style.display = 'none';
    const file = document.getElementById('import-agents-file-input').files[0];
    if(!file){ errEl.textContent = "Choisissez d'abord un fichier."; errEl.style.display='block'; return; }

    startBtn.disabled = true;
    progressEl.style.display = 'block';
    progressEl.textContent = 'Lecture du fichier…';

    try{
      const XLSX = await loadSheetJS();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('agent')) || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });

      let added = 0, skippedDup = 0, skippedInvalid = 0;
      const existingMatricules = new Set(agentsCache.map(a => a.matricule.toLowerCase()));

      for(let i=0; i<rows.length; i++){
        const row = rows[i];
        progressEl.textContent = `Traitement ${i+1} / ${rows.length}…`;
        const matricule = sanitizeInput(String(row['Matricule'] ?? '')).toUpperCase();
        const nom = sanitizeInput(String(row['Nom'] ?? '')).toUpperCase();
        const prenom = sanitizeInput(String(row['Prénom'] ?? row['Prenom'] ?? '')).toUpperCase();
        const garageRaw = sanitizeInput(String(row['Garage'] ?? ''));
        const equipeRaw = sanitizeInput(String(row['Équipe'] ?? row['Equipe'] ?? ''));
        const statutRaw = sanitizeInput(String(row['Statut'] ?? '')) || 'Actif';
        const roleRaw = sanitizeInput(String(row['Rôle'] ?? row['Role'] ?? '')).toLowerCase() || 'agent';

        if(!matricule || !nom || !prenom || !garageRaw || !/^\d{5}$/.test(matricule)){ skippedInvalid++; continue; }
        if(existingMatricules.has(matricule.toLowerCase())){ skippedDup++; continue; }

        const garage = garagesCache.find(g => g.toLowerCase() === garageRaw.toLowerCase()) || garageRaw;
        const equipe = equipesCache.find(e => e.toLowerCase() === equipeRaw.toLowerCase()) || '';
        const role = rolesCache.some(r=>r.id===roleRaw) ? roleRaw : 'agent';
        const statut = statutRaw.toLowerCase() === 'inactif' ? 'Inactif' : 'Actif';

        await setDoc(doc(db,'agents',matricule), {
          matricule, nom, prenom, garage, equipe, statut, role, permissions: getRoleDef(role).permissions || {},
          mustChangePassword: true, createdAt: nowIso()
        });
        existingMatricules.add(matricule.toLowerCase());
        createdAgents.push({ matricule, nom, prenom });
        added++;
      }

      // Comptes de connexion + mots de passe provisoires (service sécurisé), par lots
      const tempPasswords = [];
      let loginErrors = 0;
      for(let i=0; i<createdAgents.length; i+=40){
        progressEl.textContent = `Création des comptes de connexion… ${Math.min(i+40, createdAgents.length)} / ${createdAgents.length}`;
        const batch = createdAgents.slice(i, i+40).map(x=>x.matricule);
        try{
          const r = await svAdmin('/bulk-create', { matricules: batch });
          (r.results||[]).forEach(x=>{ if(x.tempPassword) tempPasswords.push(x); else loginErrors++; });
        }catch(e){ loginErrors += batch.length; }
      }

      progressEl.style.display = 'none';
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        <div class="panel" style="padding:14px 16px;">
          <p style="font-size:13.5px;margin:0 0 6px;"><b>${added}</b> agent${added>1?'s':''} créé${added>1?'s':''}${loginErrors ? ` — <span style="color:var(--red);">${loginErrors} compte${loginErrors>1?'s':''} de connexion non créé${loginErrors>1?'s':''} (réessayez via « Mot de passe provisoire »)</span>` : ''}</p>
          ${tempPasswords.length ? `<p style="font-size:12.5px;color:var(--steel);margin:6px 0;">Mots de passe provisoires (à donner à chaque agent, changement obligatoire à la première connexion — <b>notez-les maintenant, ils ne seront plus affichés</b>) :</p>
          <textarea readonly rows="${Math.min(12, tempPasswords.length+1)}" style="width:100%;font-family:monospace;font-size:12.5px;">${tempPasswords.map(x=>{ const a=createdAgents.find(c=>c.matricule===x.matricule)||{}; return `${x.matricule}\t${escapeHtml(a.prenom||'')} ${escapeHtml(a.nom||'')}\t${escapeHtml(x.tempPassword)}`; }).join('\n')}</textarea>` : ''}
          ${skippedDup ? `<p style="font-size:12.5px;color:var(--steel);margin:0 0 4px;">${skippedDup} matricule${skippedDup>1?'s':''} déjà existant${skippedDup>1?'s':''}, ignoré${skippedDup>1?'s':''}</p>` : ''}
          ${skippedInvalid ? `<p style="font-size:12.5px;color:var(--red);margin:0;">${skippedInvalid} ligne${skippedInvalid>1?'s':''} incomplète${skippedInvalid>1?'s':''}, ignorée${skippedInvalid>1?'s':''}</p>` : ''}
        </div>`;
      startBtn.style.display = 'none';
    }catch(err){
      progressEl.style.display = 'none';
      errEl.textContent = "Erreur lors de l'import : " + err.message;
      errEl.style.display = 'block';
      startBtn.disabled = false;
    }
  });
}

async function loadJsPDF(){
  if(!window.jspdf){
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  }
  if(!window.jspdf.jsPDF.API.autoTable){
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");
  }
  return window.jspdf.jsPDF;
}

/* ============ SCAN CODE-BARRES / QR ============ */
let _activeScanner = null;
async function loadHtml5Qrcode(){
  if(!window.Html5Qrcode){
    await loadScriptOnce("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js");
  }
  return window.Html5Qrcode;
}

function openScanModal(onResult){
  openModal(`
    <div class="modal-head"><h3>Scanner un code</h3><button class="modal-close" id="scan-close">&times;</button></div>
    <div class="modal-error" id="scan-error"></div>
    <div id="qr-reader" style="width:100%;border-radius:8px;overflow:hidden;background:#111;min-height:220px;"></div>
    <p style="font-size:12px;color:var(--steel);margin-top:10px;">Autorisez l'accès à la caméra, puis présentez le code-barres ou QR code de l'outil.</p>
    <div class="modal-actions"><button class="btn btn-secondary" id="scan-cancel">Fermer</button></div>
  `);

  async function stopAndClose(){
    if(_activeScanner){
      try{ await _activeScanner.stop(); }catch(e){}
      try{ await _activeScanner.clear(); }catch(e){}
      _activeScanner = null;
    }
    closeModal();
  }
  document.getElementById('scan-close').addEventListener('click', stopAndClose);
  document.getElementById('scan-cancel').addEventListener('click', stopAndClose);

  loadHtml5Qrcode().then(Html5Qrcode => {
    _activeScanner = new Html5Qrcode("qr-reader");
    _activeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        const text = decodedText.trim();
        stopAndClose().then(()=> onResult(text));
      },
      ()=>{ /* frames sans code détecté : on ignore */ }
    ).catch(err => {
      const errEl = document.getElementById('scan-error');
      if(errEl){
        errEl.textContent = "Impossible d'accéder à la caméra : " + (err.message || err);
        errEl.style.display = 'block';
      }
    });
  }).catch(err => {
    const errEl = document.getElementById('scan-error');
    if(errEl){
      errEl.textContent = "Erreur de chargement du scanner : " + err.message;
      errEl.style.display = 'block';
    }
  });
}

async function downloadInventairePDF(inventaireId, servanteId){
  try{
    const s = servantesCache.find(x=>x.id===servanteId);
    const invSnap = await getDoc(doc(db,'inventaires',inventaireId));
    if(!invSnap.exists()) return;
    const inv = invSnap.data();
    const JsPDF = await loadJsPDF();
    const pdf = new JsPDF({ unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const contentW = pageW - margin*2;
    const green = [0,166,81];
    const charcoal = [32,36,42];
    const steel = [91,101,112];

    /* Bandeau d'en-tête */
    pdf.setFillColor(...charcoal);
    pdf.rect(0, 0, pageW, 26, 'F');
    pdf.setFillColor(...green);
    pdf.rect(0, 0, 4, 26, 'F');
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(15);
    pdf.setFont(undefined, 'bold');
    pdf.text("FICHE D'INVENTAIRE", margin, 13);
    pdf.setFontSize(8.5);
    pdf.setFont(undefined, 'normal');
    pdf.text("Servante d'outillage — Gestion d'atelier", margin, 19);
    pdf.setFontSize(7.5);
    pdf.text(formatDate(nowIso()).split(' à ')[0], pageW - margin, 19, { align: 'right' });

    /* Bloc informations */
    let y = 34;
    const boxH = 26;
    const colW = contentW / 2;
    pdf.setDrawColor(220,220,220);
    pdf.setFillColor(250,251,250);
    pdf.roundedRect(margin, y, contentW, boxH, 2, 2, 'FD');
    const infoRows = [
      ["Agent", `${s.agentNom || 'Non attribuée'}${s.agentMatricule ? ' ('+s.agentMatricule+')' : ''}`],
      ["Garage", s.garage || '—'],
      ["Date de l'inventaire", formatDate(inv.dateInventaire).split(' à ')[0]],
      ["Réalisé par", inv.realiseParNom]
    ];
    infoRows.forEach((row, idx) => {
      const colX = margin + 6 + (idx % 2) * colW;
      const rowY = y + 8 + Math.floor(idx/2) * 11;
      pdf.setFontSize(7);
      pdf.setTextColor(...steel);
      pdf.text(row[0].toUpperCase(), colX, rowY);
      pdf.setFontSize(9.5);
      pdf.setTextColor(...charcoal);
      pdf.setFont(undefined, 'bold');
      const valLine = pdf.splitTextToSize(String(row[1]), colW - 10)[0];
      pdf.text(valLine, colX, rowY + 5);
      pdf.setFont(undefined, 'normal');
    });
    y += boxH + 8;

    /* Tableau des outils — largeurs fixes pour ne jamais dépasser la page */
    const rows = (inv.resultats||[]).map(r => [r.reference, r.designation, r.categorie||'—', r.resultat]);
    pdf.autoTable({
      startY: y,
      margin: { left: margin, right: margin },
      tableWidth: contentW,
      head: [["Référence", "Désignation", "Catégorie", "Résultat"]],
      body: rows,
      theme: 'grid',
      styles: { fontSize: 8.5, cellPadding: 3, lineColor: [225,228,225], lineWidth: 0.2, overflow: 'linebreak', valign: 'middle' },
      headStyles: { fillColor: charcoal, textColor: 255, fontStyle: 'bold', halign: 'left', fontSize: 8.5 },
      alternateRowStyles: { fillColor: [248,249,248] },
      columnStyles: {
        0: { cellWidth: 34 },
        1: { cellWidth: 'auto' },
        2: { cellWidth: 32 },
        3: { cellWidth: 24, fontStyle: 'bold', halign: 'center' }
      },
      didParseCell: (data) => {
        if(data.section === 'body' && data.column.index === 3){
          const val = data.cell.raw;
          if(val === 'Conforme'){ data.cell.styles.textColor = [0,134,63]; }
          else if(val === 'Cassé' || val === 'Manquant'){ data.cell.styles.textColor = [214,69,69]; }
          else if(val === 'Usé'){ data.cell.styles.textColor = [143,100,18]; }
        }
      }
    });

    let finalY = pdf.lastAutoTable.finalY + 8;
    const ecarts = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme');
    if(finalY > pageH - 45){ pdf.addPage(); finalY = 20; }

    /* Résumé écarts */
    pdf.setFontSize(9.5);
    pdf.setTextColor(...charcoal);
    pdf.setFont(undefined, 'bold');
    pdf.text(`Écarts constatés : ${ecarts.length}`, margin, finalY);
    pdf.setFont(undefined, 'normal');
    finalY += 8;

    /* Bloc validation — hauteur dynamique selon le contenu, jamais de débordement */
    const fullyValidated = inv.valideParAgent && inv.valideParAdmin;
    const boxColor = fullyValidated ? green : [214,69,69];
    const validationLines = [];
    if(fullyValidated){
      validationLines.push({ text:`✓ Validé par l'agent : ${inv.valideParAgentNom} (le ${formatDate(inv.valideParAgentLe).split(' à ')[0]})`, bold:true });
      validationLines.push({ text:`✓ Approuvé par l'administrateur : ${inv.valideParAdminNom} (le ${formatDate(inv.valideParAdminLe).split(' à ')[0]})`, bold:true });
    } else if(inv.valideParAgent){
      validationLines.push({ text:`✓ Validé par l'agent : ${inv.valideParAgentNom} (le ${formatDate(inv.valideParAgentLe).split(' à ')[0]})`, bold:true });
      validationLines.push({ text:`En attente d'approbation par l'administrateur`, bold:false });
    } else {
      validationLines.push({ text:`En attente de validation par l'agent`, bold:false });
    }
    const valBoxH = 6 + validationLines.length * 7;
    if(finalY + valBoxH > pageH - 20){ pdf.addPage(); finalY = 20; }
    pdf.setDrawColor(...boxColor);
    pdf.setFillColor(...(fullyValidated ? [228,246,236] : [251,231,231]));
    pdf.roundedRect(margin, finalY, contentW, valBoxH, 2, 2, 'FD');
    pdf.setFontSize(9.5);
    pdf.setTextColor(...(fullyValidated ? [0,134,63] : [214,69,69]));
    validationLines.forEach((line, i) => {
      pdf.setFont(undefined, line.bold ? 'bold' : 'normal');
      const wrapped = pdf.splitTextToSize(line.text, contentW - 12)[0];
      pdf.text(wrapped, margin + 6, finalY + 8 + i*7);
    });

    pdf.setFont(undefined, 'normal');
    pdf.setTextColor(...steel);
    pdf.setFontSize(7);
    pdf.text(`Document généré le ${formatDate(nowIso()).split(' à ')[0]}`, margin, pageH - 10);

    pdf.save(`inventaire_${s.agentMatricule}_${inv.dateInventaire.slice(0,10)}.pdf`);
  }catch(err){
    showToast("Erreur lors de la génération du PDF : " + err.message, 'error');
  }
}

async function validerInventaireAdmin(inventaireId, servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
  try{
    const invSnap = await getDoc(doc(db,'inventaires',inventaireId));
    if(!invSnap.exists()) return;
    const inv = invSnap.data();
    if(!inv.valideParAgent){
      showToast("L'agent doit d'abord valider cet inventaire avant l'approbation de l'administrateur.", 'warning');
      return;
    }
    const nonConformes = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme');
    const typeMap = { 'Manquant':'manquant', 'Cassé':'casse', 'Usé':'usure' };

    let newOutilsAssignes = (s.outilsAssignes||[]);
    for(const r of nonConformes){
      newOutilsAssignes = newOutilsAssignes.map(t => t.localId===r.localId ? {...t, actif:false, etat:r.resultat} : t);
      await logMouvement({
        servanteId, outilId: r.outilId, reference: r.reference, designation: r.designation,
        type: typeMap[r.resultat] || 'manquant',
        motif: `Constaté lors de l'inventaire du ${formatDate(inv.dateInventaire)}`
      }, { preValide: true });
    }
    if(nonConformes.length){
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: newOutilsAssignes });
    }
    const servanteUpdate = { dernierInventaire: { date: inv.dateInventaire, inventaireId }, prochainInventairePrevu: null };
    await updateDoc(doc(db,'servantes',servanteId), servanteUpdate);
    await updateDoc(doc(db,'inventaires',inventaireId), {
      valideParAdmin: true,
      valideParAdminMatricule: currentUser.matricule,
      valideParAdminNom: `${currentUser.prenom} ${currentUser.nom}`,
      valideParAdminLe: nowIso()
    });
    // Mise à jour immédiate du cache local pour un rafraîchissement instantané de l'affichage
    const idx = servantesCache.findIndex(x=>x.id===servanteId);
    if(idx !== -1) servantesCache[idx] = { ...servantesCache[idx], ...servanteUpdate };
    updatePendingBadge();
    if(currentServanteId === servanteId) renderServanteDetail(servanteId);
  }catch(err){
    showToast("Erreur lors de la validation : " + err.message, 'error');
  }
}

/* ============ MODÈLE DE DOTATION TYPE ============ */
async function enregistrerCommeModele(servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
  const outils = (s.outilsAssignes||[]).filter(t=>t.actif);
  if(!outils.length){
    showToast("Cette servante n'a aucun outil actif à enregistrer comme modèle.", 'warning');
    return;
  }
  showConfirmModal(`Enregistrer les ${outils.length} outils de cette servante comme modèle de dotation type ? Cela remplacera le modèle existant.`, async ()=>{
    try{
      await setDoc(doc(db,'parametres','modeleDotation'), {
        outils: outils.map(t => ({ outilId: t.outilId, reference: t.reference, designation: t.designation, categorie: t.categorie })),
        updatedAt: nowIso(),
        updatedPar: `${currentUser.prenom} ${currentUser.nom}`
      });
      showToast("Modèle de dotation enregistré.", 'success');
    }catch(err){
      showToast("Erreur : " + err.message, 'error');
    }
  }, { title:'Enregistrer comme modèle', confirmLabel:'Enregistrer', danger:false });
}

async function chargerModele(servanteId){
  if(!modeleDotationCache || !modeleDotationCache.outils || !modeleDotationCache.outils.length){
    showToast("Aucun modèle de dotation type n'a encore été enregistré.", 'warning');
    return;
  }
  const s = servantesCache.find(x=>x.id===servanteId);
  const existingIds = new Set((s.outilsAssignes||[]).filter(t=>t.actif).map(t=>t.outilId));
  const aAjouter = modeleDotationCache.outils.filter(t => !existingIds.has(t.outilId));
  if(!aAjouter.length){
    showToast("Tous les outils du modèle sont déjà présents dans cette servante.", 'info');
    return;
  }
  showConfirmModal(`Ajouter les ${aAjouter.length} outils manquants du modèle à cette servante ?`, async ()=>{
    try{
      const newEntries = aAjouter.map(t => ({
        localId: uid(), outilId: t.outilId, reference: t.reference, designation: t.designation, categorie: t.categorie,
        dateAttribution: nowIso(), actif: true, etat: 'En service'
      }));
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: [...(s.outilsAssignes||[]), ...newEntries] });
      for(const t of aAjouter){
        await logMouvement({ servanteId, outilId: t.outilId, reference: t.reference, designation: t.designation, type: 'attribution', motif: 'Ajouté depuis le modèle de dotation type' });
      }
      showToast(`${aAjouter.length} outil(s) ajouté(s) depuis le modèle.`, 'success');
    }catch(err){
      showToast("Erreur : " + err.message, 'error');
    }
  }, { title:'Charger le modèle', confirmLabel:'Ajouter', danger:false });
}

async function attribuerToutLeCatalogue(servanteId){
  if(!outilsCache.length){
    showToast("Le catalogue d'outils est vide.", 'warning');
    return;
  }
  const s = servantesCache.find(x=>x.id===servanteId);
  const existingIds = new Set((s.outilsAssignes||[]).filter(t=>t.actif).map(t=>t.outilId));
  const aAjouter = outilsCache.filter(o => !existingIds.has(o.id));
  if(!aAjouter.length){
    showToast("Tous les outils du catalogue sont déjà présents dans cette servante.", 'info');
    return;
  }
  showConfirmModal(`Attribuer les ${aAjouter.length} outils du catalogue à cette servante ? Cette opération peut prendre un moment.`, async ()=>{
    try{
      const newEntries = aAjouter.map(o => ({
        localId: uid(), outilId: o.id, reference: o.reference, designation: o.designation, categorie: o.categorie,
        dateAttribution: nowIso(), actif: true, etat: 'En service'
      }));
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: [...(s.outilsAssignes||[]), ...newEntries] });
      for(const o of aAjouter){
        await logMouvement({ servanteId, outilId: o.id, reference: o.reference, designation: o.designation, type: 'attribution', motif: 'Attribution de tout le catalogue (servante type)' });
      }
      showToast(`${aAjouter.length} outils attribués avec succès.`, 'success');
    }catch(err){
      showToast("Erreur : " + err.message, 'error');
    }
  }, { title:'Attribuer tout le catalogue', confirmLabel:'Attribuer', danger:false });
}

function openAssignToolModal(servanteId){
  const byCategory = {};
  outilsCache.forEach(o=>{
    if(!byCategory[o.categorie]) byCategory[o.categorie] = [];
    byCategory[o.categorie].push(o);
  });
  const options = Object.keys(byCategory).sort().map(cat => `
    <optgroup label="${escapeHtml(cat)}">
      ${byCategory[cat].sort((a,b)=>a.designation.localeCompare(b.designation)).map(o=>`<option value="${o.id}">${escapeHtml(o.designation)} (${escapeHtml(o.reference)})</option>`).join('')}
    </optgroup>`).join('');
  openModal(`
    <div class="modal-head"><h3>Attribuer un outil</h3><button class="modal-close" id="m-close">&times;</button></div>
    <div class="modal-error" id="assign-modal-error"></div>
    <form id="assign-form">
      <div class="field">
        <label>Outil (classé par catégorie)</label>
        <div style="display:flex;gap:8px;">
          <select id="assign-outil" required style="flex:1;">
            <option value="">Sélectionner un outil…</option>
            ${options}
          </select>
          <button type="button" class="btn btn-secondary btn-sm" id="assign-scan-btn" title="Scanner le code" style="flex-shrink:0;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><rect x="3" y="3" width="6" height="6" stroke="currentColor" stroke-width="1.7"/><rect x="15" y="3" width="6" height="6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="15" width="6" height="6" stroke="currentColor" stroke-width="1.7"/><path d="M15 15h3v3h-3zM21 15v6M15 21h3" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Attribuer</button>
      </div>
    </form>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('assign-scan-btn').addEventListener('click', ()=>{
    openScanModal((code)=>{
      const match = outilsCache.find(o => o.reference.toLowerCase() === code.trim().toLowerCase());
      openAssignToolModal(servanteId);
      setTimeout(()=>{
        const errEl = document.getElementById('assign-modal-error');
        if(match){
          document.getElementById('assign-outil').value = match.id;
        } else if(errEl){
          errEl.textContent = `Aucun outil du catalogue ne correspond au code « ${code} ».`;
          errEl.style.display = 'block';
        }
      }, 0);
    });
  });
  document.getElementById('assign-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('assign-modal-error');
    const outilId = document.getElementById('assign-outil').value;
    if(!outilId){ errEl.textContent = "Veuillez choisir un outil."; errEl.style.display='block'; return; }
    const outil = outilsCache.find(o=>o.id===outilId);
    const s = servantesCache.find(x=>x.id===servanteId);
    const localId = uid();
    const entry = {
      localId, outilId, reference: outil.reference, designation: outil.designation, categorie: outil.categorie,
      dateAttribution: nowIso(), actif: true, etat: 'En service'
    };
    try{
      const updated = [...(s.outilsAssignes||[]), entry];
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: updated });
      await logMouvement({
        servanteId, outilId, reference: outil.reference, designation: outil.designation,
        type: 'attribution', motif: ''
      });
      closeModal();
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  });
}

function openMouvementModal(servanteId, localId, type){
  const s = servantesCache.find(x=>x.id===servanteId);
  const tool = (s.outilsAssignes||[]).find(t=>t.localId===localId);
  const info = MVT_TYPES[type];
  const needsReplacement = type === 'echange';
  const byCategory = {};
  outilsCache.forEach(o=>{
    if(!byCategory[o.categorie]) byCategory[o.categorie] = [];
    byCategory[o.categorie].push(o);
  });
  const options = Object.keys(byCategory).sort().map(cat => `
    <optgroup label="${escapeHtml(cat)}">
      ${byCategory[cat].sort((a,b)=>a.designation.localeCompare(b.designation)).map(o=>`<option value="${o.id}">${escapeHtml(o.designation)} (${escapeHtml(o.reference)})</option>`).join('')}
    </optgroup>`).join('');

  openModal(`
    <div class="modal-head"><h3>${escapeHtml(info.label)} — ${escapeHtml(tool.designation)}</h3><button class="modal-close" id="m-close">&times;</button></div>
    <div class="modal-error" id="mvt-modal-error"></div>
    <form id="mvt-form">
      <p style="font-size:13px;color:var(--steel);margin-bottom:14px;">${escapeHtml(tool.reference)} · en dotation depuis le ${formatDate(tool.dateAttribution)}</p>
      ${needsReplacement ? `
      <div class="field">
        <label>Nouvel outil de remplacement</label>
        <select id="mvt-nouvel-outil" required>
          <option value="">Sélectionner un outil…</option>
          ${options}
        </select>
      </div>` : ''}
      <div class="field">
        <label>Motif${needsReplacement?'':' (optionnel)'}</label>
        <textarea id="mvt-motif" rows="3" placeholder="Précisez la raison de ce mouvement…" ${needsReplacement?'required':''}></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Confirmer</button>
      </div>
    </form>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('mvt-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('mvt-modal-error');
    const motif = sanitizeInput(document.getElementById('mvt-motif').value);
    try{
      let newOutilsAssignes = (s.outilsAssignes||[]).map(t=>{
        if(t.localId !== localId) return t;
        return { ...t, actif:false, etat: info.label };
      });
      let mvtPayload = {
        servanteId, outilId: tool.outilId, reference: tool.reference, designation: tool.designation,
        type, motif
      };
      if(needsReplacement){
        const newOutilId = document.getElementById('mvt-nouvel-outil').value;
        if(!newOutilId){ throw new Error("Veuillez choisir l'outil de remplacement."); }
        const newOutil = outilsCache.find(o=>o.id===newOutilId);
        const newEntry = {
          localId: uid(), outilId: newOutil.id, reference: newOutil.reference, designation: newOutil.designation,
          categorie: newOutil.categorie, dateAttribution: nowIso(), actif:true, etat:'En service'
        };
        newOutilsAssignes = [...newOutilsAssignes, newEntry];
        mvtPayload.ancienOutilId = tool.outilId;
        mvtPayload.ancienReference = tool.reference;
        mvtPayload.nouvelOutilId = newOutil.id;
        mvtPayload.nouvelleReference = newOutil.reference;
      }
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: newOutilsAssignes });
      await logMouvement(mvtPayload);
      closeModal();
    }catch(err){
      errEl.textContent = err.message; errEl.style.display = 'block';
    }
  });
}
