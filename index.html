  document.getElementById('btn-export-dotation').addEventListener('click', ()=>exporterDotationExcel(servanteId));
  const delSv = document.getElementById('btn-del-servante');
  if(delSv) delSv.addEventListener('click', ()=>corrigerServanteSupprimer(servanteId));
  if(canProgrammer) document.getElementById('btn-programmer-inv').addEventListener('click', ()=>openProgrammerInventaireModal(servanteId));
  const btnCat = document.getElementById('btn-tout-catalogue');
  if(btnCat) btnCat.addEventListener('click', ()=>attribuerToutLeCatalogue(servanteId));

  const toolsPanel = document.getElementById('tools-panel');
  if(!outils.length){
    toolsPanel.innerHTML = `<div class="empty-state"><p>Aucun outil attribué pour le moment.</p></div>`;
  } else {
    const groupes = new Map();
    outils.slice().sort((a,b)=> (a.ordre||999999)-(b.ordre||999999) || a.designation.localeCompare(b.designation)).forEach(t=>{
      const g = t.groupe || t.categorie || 'Autres outils';
      if(!groupes.has(g)) groupes.set(g, []);
      groupes.get(g).push(t);
    });
    const ligne = t => `
      <div class="tool-row">
        <div class="meta">
          <div class="desig">${escapeHtml(t.designation)}${(t.quantite||1)>1 ? ` <b>× ${t.quantite}</b>` : ''}</div>
          <div class="ref">${escapeHtml(t.reference)}${t.numeroSerie ? ' · S/N ' + escapeHtml(t.numeroSerie) : ''}</div>
        </div>
        ${canMouvements || canAttribuer ? `
        <div class="tool-actions">
          ${canAttribuer ? `<button class="btn btn-secondary btn-sm" data-edit-dot="${t.localId}">Modifier</button>` : ''}
          ${canMouvements ? `<button class="btn btn-secondary btn-sm" data-signaler="${t.localId}">Signaler…</button>` : ''}
        </div>` : ''}
      </div>`;
    toolsPanel.innerHTML = [...groupes.entries()].map(([g, list], i) => `
      <details class="grp-outils" ${groupes.size === 1 ? 'open' : ''}>
        <summary style="cursor:pointer;padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line);background:#F6F8F6;">${escapeHtml(g)} <span style="font-weight:400;color:var(--steel);">· ${list.length} outil${list.length>1?'s':''}</span></summary>
        ${list.map(ligne).join('')}
      </details>`).join('');
    toolsPanel.querySelectorAll('[data-edit-dot]').forEach(b=>{
      b.addEventListener('click', ()=>openModifierDotationModal(servanteId, b.dataset.editDot));
    });
    toolsPanel.querySelectorAll('[data-signaler]').forEach(b=>{
      b.addEventListener('click', ()=>openSignalerOutilModal(servanteId, b.dataset.signaler));
    });
  }

  // Outils sortis de la dotation (manquants, cassés, usés…) : possibilité de les remettre en service
  const sortis = (s.outilsAssignes||[]).filter(t => !t.actif);
  const outSection = document.getElementById('out-section');
  if(outSection && sortis.length){
    const peutRemettre = canMouvements || isAdminUser();
    outSection.innerHTML = `
      ${sortis.filter(t => t.etat !== 'Hors dotation').length ? `<div class="section-label">Écarts à traiter : cassés, perdus, usés (${sortis.filter(t => t.etat !== 'Hors dotation').length})</div>` : ''}
      <div class="panel" ${sortis.filter(t => t.etat !== 'Hors dotation').length ? '' : 'style="display:none;"'}>${sortis.filter(t => t.etat !== 'Hors dotation').map(t => {
        const mv = mouvementsAllCache.filter(m => m.servanteId === servanteId && m.outilId && m.outilId === t.outilId && mouvementARemplacer(m))
                                     .sort((a,b)=> new Date(b.date) - new Date(a.date))[0];
        return `
        <div class="tool-row">
          <div class="meta">
            <div class="desig">${escapeHtml(t.designation)} <span class="pill pill-${t.etat==='Usé'?'amber':'red'}" style="margin-left:6px;">${escapeHtml(libEcart(t.etat||'Retiré'))}</span></div>
            <div class="ref">${escapeHtml(t.reference)}</div>
          </div>
          ${peutRemettre ? `<div class="tool-actions">
            ${mv ? `<button class="btn btn-primary btn-sm" data-remplacer-mvt="${mv.id}">Remplacé (pièce neuve)</button>` : ''}
            <button class="btn btn-secondary btn-sm" data-remettre="${t.localId}">${mv ? 'Retrouvé / remis en service' : 'Remettre en service'}</button>
          </div>` : ''}
        </div>`; }).join('')}</div>
      ${sortis.filter(t => t.etat === 'Hors dotation').length ? `
      <details class="panel" style="margin-top:12px;">
        <summary style="cursor:pointer;padding:12px 16px;font-weight:700;">Hors dotation : outils que l'agent n'a pas (${sortis.filter(t => t.etat === 'Hors dotation').length})</summary>
        ${sortis.filter(t => t.etat === 'Hors dotation').map(t => `
        <div class="tool-row">
          <div class="meta"><div class="desig">${escapeHtml(t.designation)}</div><div class="ref">${escapeHtml(t.reference)}</div></div>
          ${peutRemettre ? `<div class="tool-actions"><button class="btn btn-secondary btn-sm" data-remettre="${t.localId}">Remettre dans la dotation</button></div>` : ''}
        </div>`).join('')}
      </details>` : ''}`;
    outSection.querySelectorAll('[data-remettre]').forEach(b=>{
      b.addEventListener('click', ()=>remettreOutilEnService(servanteId, b.dataset.remettre));
    });
    outSection.querySelectorAll('[data-remplacer-mvt]').forEach(b=>{
      b.addEventListener('click', ()=>ouvrirRemplacement(b.dataset.remplacerMvt));
    });
  }

  loadMouvements(servanteId);
  loadInventaires(servanteId);
}

async function loadMouvements(servanteId){
  const panel = document.getElementById('mvts-panel');
  if(!panel) return;
  const s = servantesCache.find(x=>x.id===servanteId);
  try{
    const q = query(collection(db,'mouvements'), where('servanteId','==',servanteId));
    const snap = await getDocs(q);
    let all = snap.docs.map(d=>({id:d.id, ...d.data()}));
    let list = all.filter(m => !(m.valideParAgent && m.valideParAdmin));
    list.sort((a,b)=> new Date(b.date) - new Date(a.date));
    const validesCount = all.length - list.length;
    const journalLink = `<div style="padding:12px 16px;${list.length?'border-top:1px solid var(--line);':''}"><button class="btn btn-secondary btn-sm" id="mvt-journal-link">Voir l'historique complet dans le Journal${validesCount?` (${validesCount} validé${validesCount>1?'s':''})`:''}</button></div>`;
    if(!list.length){
      panel.innerHTML = `<div class="empty-state"><p>Aucun mouvement en attente.</p></div>${journalLink}`;
      bindJournalLink('mvt-journal-link', s);
      return;
    }

    // Regroupement par type de mouvement
    const groups = {};
    list.forEach(m=>{ (groups[m.type] = groups[m.type] || []).push(m); });
    const canAgentStep = canValidateAgentStep(s);
    const canAdminStep = canValidateAdminStep();

    panel.innerHTML = Object.keys(groups).map(type => {
      const info = MVT_TYPES[type] || {label:type, color:'gray'};
      const items = groups[type];
      const pendingAgent = items.filter(m=>!m.valideParAgent);
      const pendingAdmin = items.filter(m=>m.valideParAgent && !m.valideParAdmin);
      return `
      <div style="border-bottom:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#FAFBFA;">
          <b style="font-size:12.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--steel);">${escapeHtml(info.label)} (${items.length})</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${pendingAgent.length && canAgentStep ? `<button class="btn btn-primary btn-sm" data-bulk-agent="${type}">Valider les ${pendingAgent.length} (agent)</button>` : ''}
            ${pendingAdmin.length && canAdminStep ? `<button class="btn btn-primary btn-sm" data-bulk-admin="${type}">Approuver les ${pendingAdmin.length} (admin)</button>` : ''}
          </div>
        </div>
        ${items.map(m => `
          <div class="mvt-item">
            <div class="mvt-icon pill-${info.color}" style="background:var(--${info.color==='gray'?'line':info.color+'-pale'});color:var(--${info.color==='gray'?'steel':(info.color==='amber'?'amber':info.color)});">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
            </div>
            <div class="mvt-body" style="flex:1;">
              <div>${escapeHtml(m.designation||'')} <span class="ref mono">${escapeHtml(m.reference||'')}</span></div>
              ${m.motif ? `<div class="mvt-motif">« ${escapeHtml(m.motif)} »</div>` : ''}
              <div style="color:var(--steel-light);margin-top:2px;">Par ${escapeHtml(m.utilisateurNom||m.utilisateur)}</div>
              <div style="margin-top:5px;">
                ${validationStatusHtml(m, s, `data-validate-mvt-agent="${m.id}"`, `data-validate-mvt-admin="${m.id}"`)}
              </div>
              ${isAdminUser() ? `<div style="margin-top:6px;"><button class="btn btn-danger btn-sm" data-del-mvt="${m.id}">Supprimer</button></div>` : ''}
            </div>
            <div class="mvt-date">${formatDate(m.date)}</div>
          </div>`).join('')}
      </div>`;
    }).join('') + journalLink;

    panel.querySelectorAll('[data-validate-mvt-agent]').forEach(b=>{
      b.addEventListener('click', ()=>validerMouvementAgent(b.dataset.validateMvtAgent));
    });
    panel.querySelectorAll('[data-del-mvt]').forEach(b=>{
      b.addEventListener('click', ()=>corrigerMouvementSupprimer(b.dataset.delMvt));
    });
    panel.querySelectorAll('[data-validate-mvt-admin]').forEach(b=>{
      b.addEventListener('click', ()=>validerMouvementAdmin(b.dataset.validateMvtAdmin));
    });
    panel.querySelectorAll('[data-bulk-agent]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const ids = groups[b.dataset.bulkAgent].filter(m=>!m.valideParAgent).map(m=>m.id);
        validerMouvementsBulkAgent(ids);
      });
    });
    panel.querySelectorAll('[data-bulk-admin]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const ids = groups[b.dataset.bulkAdmin].filter(m=>m.valideParAgent && !m.valideParAdmin).map(m=>m.id);
        validerMouvementsBulkAdmin(ids);
      });
    });
    bindJournalLink('mvt-journal-link', s);
  }catch(err){
    panel.innerHTML = `<div class="empty-state"><p>Erreur de chargement de l'historique.</p></div>`;
  }
}

function bindJournalLink(btnId, servante){
  const btn = document.getElementById(btnId);
  if(!btn) return;
  if(currentUser.role === 'agent'){
    btn.textContent = btn.textContent.replace('Voir l\'historique complet dans le Journal', 'Voir mon historique validé');
    btn.addEventListener('click', ()=>openMonHistoriqueModal(servante));
    return;
  }
  btn.addEventListener('click', ()=>{
    currentView = 'journal';
    renderNav();
    renderCurrentView();
    setTimeout(()=>{
      const tabBtn = document.getElementById('journal-tab-historique');
      if(tabBtn) tabBtn.click();
      const searchInput = document.getElementById('hist-search');
      if(searchInput){ searchInput.value = servante.agentNom || ''; searchInput.dispatchEvent(new Event('input')); }
    }, 0);
  });
}

function openMonHistoriqueModal(servante){
  const mvtRows = mouvementsAllCache
    .filter(m => m.servanteId===servante.id && m.valideParAgent && m.valideParAdmin)
    .map(m => ({
      type:'mouvement', date:m.date, label:(MVT_TYPES[m.type]||{label:m.type}).label,
      detail: `${m.designation||''} (${m.reference||''})${m.motif?' — « '+m.motif+' »':''}`,
    }));
  const invRows = inventairesAllCache
    .filter(i => i.servanteId===servante.id && i.valideParAgent && i.valideParAdmin)
    .map(i => {
      const ecarts = (i.resultats||[]).filter(r=>r.resultat!=='Conforme').length;
      return { type:'inventaire', id:i.id, date:i.dateInventaire, label:'Inventaire', detail:`${ecarts} écart${ecarts>1?'s':''} · réalisé par ${i.realiseParNom||''}` };
    });
  const rows = [...mvtRows, ...invRows].sort((a,b)=> new Date(b.date) - new Date(a.date));

  document.getElementById('modal-box').classList.add('modal-wide');
  openModal(`
    <div class="modal-head"><h3>Mon historique validé</h3><button class="modal-close" id="m-close">&times;</button></div>
    <p style="font-size:12.5px;color:var(--steel);margin-bottom:12px;">Mouvements et inventaires entièrement validés concernant votre servante.</p>
    <div style="max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;">
      ${!rows.length ? `<div class="empty-state"><p>Aucun élément validé pour le moment.</p></div>` : rows.map(r=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);">
          <div>
            <div><span class="pill pill-gray">${escapeHtml(r.label)}</span></div>
            <div style="font-size:12.5px;margin-top:4px;">${escapeHtml(r.detail)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <span class="mono" style="font-size:11.5px;color:var(--steel);">${formatDate(r.date)}</span>
            ${r.type==='inventaire' ? `<button class="btn btn-secondary btn-sm" data-pdf-mine="${r.id}">PDF</button>` : ''}
          </div>
        </div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" id="m-cancel">Fermer</button></div>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-pdf-mine]').forEach(b=>{
    b.addEventListener('click', ()=>downloadInventairePDF(b.dataset.pdfMine, servante.id));
  });
}

/* ============ INVENTAIRES ============ */
async function loadInventaires(servanteId){
  const panel = document.getElementById('inv-panel');
  if(!panel) return;
  const s = servantesCache.find(x=>x.id===servanteId);
  try{
    const snap = await getDocs(query(collection(db,'inventaires'), where('servanteId','==',servanteId)));
    const everything = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const drafts = everything.filter(inv => inv.brouillon === true);
    const all = everything.filter(inv => !inv.brouillon).sort((a,b)=> new Date(b.dateInventaire) - new Date(a.dateInventaire));
    const pending = all.filter(inv => !(inv.valideParAgent && inv.valideParAdmin));
    const archived = all.filter(inv => inv.valideParAgent && inv.valideParAdmin);
    const canArchive = peutArchiver();
    const dCourte = iso => iso ? new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
    const pills = (inv) => {
      const ecarts = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme');
      const retires = (inv.resultats||[]).filter(r=>r.retire);
      const retiresHtml = retires.length ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${retires.map(r=>`<span class="pill pill-gray">Hors dotation : ${escapeHtml(r.designation)}</span>`).join('')}</div>` : '';
      return retiresHtml + (ecarts.length ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;">${ecarts.map(e=>`<span class="pill ${e.resultat==='Cassé'||e.resultat==='Manquant'?'pill-red':'pill-amber'}" title="${escapeHtml(e.commentaire||'')}">${escapeHtml(e.designation)} — ${escapeHtml(libEcart(e.resultat))}${e.commentaire ? ' : ' + escapeHtml(e.commentaire) : ''}${e.photoUrl ? ' 📷' : ''}</span>`).join('')}</div>` : (retires.length ? '' : `<div style="margin-top:8px;font-size:12.5px;color:var(--steel);">Tous les outils étaient conformes.</div>`));
    };
    const tropHtml = (inv) => (inv.enTrop||[]).length ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">${inv.enTrop.map(e=>`<span class="pill pill-amber">${e.ajouter === true ? 'Ajouté à la dotation' : 'En trop'} : ${escapeHtml(e.designation)}${(e.quantite||1) > 1 ? ' × ' + e.quantite : ''}${e.commentaire ? ' — ' + escapeHtml(e.commentaire) : ''}</span>`).join('')}</div>` : '';
    const compHtml = (inv) => {
      const prev = inventairePrecedent(all, inv);
      if(!prev) return '';
      const c = comparerInventaires(inv, prev);
      const lignes = [
        ...c.changements.map(x => `<b>${escapeHtml(x.r.designation)}</b> : ${escapeHtml(libEtat(x.avant))} → ${escapeHtml(libEtat(x.apres))}`),
        ...c.ajoutes.map(x => `<b>${escapeHtml(x.r.designation)}</b> : ajouté à la dotation depuis`),
        ...c.disparus.map(x => `<b>${escapeHtml(x.r.designation)}</b> : n'est plus en dotation (il était conforme)`)
      ];
      const resume = c.total ? `${c.total} changement${c.total>1?'s':''}` : 'aucun changement';
      return `<details style="margin-top:10px;font-size:12.5px;"><summary style="cursor:pointer;color:var(--steel);">Depuis l'inventaire du ${dCourte(prev.dateInventaire)} : ${resume}${c.retiresEcart ? ` · ${c.retiresEcart} outil${c.retiresEcart>1?'s':''} retiré${c.retiresEcart>1?'s':''} suite aux écarts précédents` : ''}</summary>
        <div style="margin-top:6px;line-height:1.7;">${lignes.slice(0,40).join('<br>')}${lignes.length>40 ? `<br>… et ${lignes.length-40} autres` : ''}</div></details>`;
    };
    const draftsHtml = drafts.map(d => {
      const tot = (d.resultats||[]).length, done = (d.resultats||[]).filter(r=>r.resultat).length;
      return `<div style="border-bottom:1px solid var(--line);padding:14px 16px;background:var(--amber-pale);">
        <div style="font-weight:700;">📝 Inventaire en cours — ${done} / ${tot} outils pointés</div>
        <div style="font-size:12px;color:var(--steel);">Commencé le ${formatDate(d.debutLe || d.dateInventaire)} par ${escapeHtml(d.realiseParNom||'')}</div>
        ${done === tot && tot > 0 ? `<div style="margin-top:6px;font-size:13px;font-weight:700;color:#8A6412;">Tous les outils sont pointés : il reste à cliquer sur « Terminer l'inventaire » pour le clôturer et obtenir le PDF à signer.</div>` : ''}
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" data-resume-inv="${d.id}">${done === tot && tot > 0 ? 'Terminer l\'inventaire' : 'Reprendre l\'inventaire'}</button>
          <button class="btn btn-secondary btn-sm" data-pdf-inv="${d.id}">📄 PDF provisoire</button>
        </div>
      </div>`;
    }).join('');
    const pendingHtml = pending.map(inv => {
      const nbEcarts = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme').length;
      return `
      <div style="border-bottom:1px solid var(--line);padding:14px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:700;font-size:15px;">Inventaire du ${dCourte(inv.dateInventaire)}</div>
            <div style="font-size:12px;color:var(--steel);">Réalisé par ${escapeHtml(inv.realiseParNom||'')} · ${nbEcarts} écart${nbEcarts>1?'s':''}</div>
          </div>
          <span class="pill pill-amber"><span class="pill-dot"></span>À faire signer puis archiver</span>
        </div>
        ${pills(inv)}${tropHtml(inv)}${compHtml(inv)}
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <button class="btn btn-primary btn-sm" data-pdf-inv="${inv.id}">① Télécharger le PDF à signer</button>
          ${canArchive ? `<button class="btn btn-primary btn-sm" data-scan-inv="${inv.id}">② Envoyer le scan signé</button>` : `<span style="font-size:12.5px;color:var(--steel);">② L'archivage est fait par un responsable.</span>`}
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          ${canArchive ? `<button class="btn btn-secondary btn-sm" data-reopen-inv2="${inv.id}">Rouvrir / corriger</button>` : ''}
          ${isAdminUser() ? `<button class="btn btn-secondary btn-sm" data-sanscan-inv="${inv.id}">Archiver sans scan</button><button class="btn btn-danger btn-sm" data-del-inv="${inv.id}">Supprimer</button>` : ''}
        </div>
      </div>`;
    }).join('');
    const archivedHtml = archived.slice(0,5).map(inv => {
      const nbEcarts = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme').length;
      const pages = inv.scanPages || [];
      return `
      <div style="border-bottom:1px solid var(--line);padding:12px 16px;${inv.annule ? 'opacity:.55;' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:700;">Inventaire du ${dCourte(inv.dateInventaire)} <span class="pill pill-green" style="margin-left:6px;"><span class="pill-dot"></span>Archivé</span></div>
            <div style="font-size:12px;color:var(--steel);">${nbEcarts} écart${nbEcarts>1?'s':''} · archivé le ${dCourte(inv.valideParAdminLe)}${inv.sansScan ? ' · sans scan' : ''}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-secondary btn-sm" data-pdf-inv="${inv.id}">PDF</button>
            ${pages.length ? `<button class="btn btn-secondary btn-sm" data-scan-view="${inv.id}">Voir le scan (${pages.length} p.)</button>` : ''}
          </div>
        </div>
        ${compHtml(inv)}
      </div>`;
    }).join('');
    const validesCount = archived.length;
    const journalLink = `<div style="padding:12px 16px;${(pending.length||archived.length)?'border-top:1px solid var(--line);':''}"><button class="btn btn-secondary btn-sm" id="inv-journal-link">Voir l'historique complet dans le Journal${validesCount?` (${validesCount} archivé${validesCount>1?'s':''})`:''}</button></div>`;
    const empty = (!drafts.length && !pending.length && !archived.length) ? `<div class="empty-state"><p>Aucun inventaire pour le moment.</p></div>` : '';
    panel.innerHTML = draftsHtml + pendingHtml + archivedHtml + empty + journalLink + `<input type="file" id="scan-input" accept="application/pdf,image/*" multiple style="display:none;">`;
    let scanTarget = null, sansScan = false;
    const input = panel.querySelector('#scan-input');
    panel.querySelectorAll('[data-resume-inv]').forEach(b=>{
      b.addEventListener('click', ()=>{ const d = drafts.find(x=>x.id===b.dataset.resumeInv); if(d) openInventaireEditor(servanteId, d.id, d); });
    });
    panel.querySelectorAll('[data-pdf-inv]').forEach(b=>{
      b.addEventListener('click', ()=>downloadInventairePDF(b.dataset.pdfInv, servanteId));
    });
    panel.querySelectorAll('[data-scan-inv]').forEach(b=>{
      b.addEventListener('click', ()=>{ scanTarget = b.dataset.scanInv; input.click(); });
    });
    input.addEventListener('change', async ()=>{
      const files = Array.from(input.files || []); input.value = '';
      if(!files.length || !scanTarget) return;

/* Archivage : le scan signé remplace les deux validations numériques ; les écarts sont enregistrés (cassé, perdu, usé…). */
async function archiverInventaire(inventaireId, servanteId, files, opts){
  opts = opts || {};
  const s = servantesCache.find(x=>x.id===servanteId); if(!s) return;
  if(!peutArchiver()){ showToast("Vous n'avez pas le droit d'archiver un inventaire.", 'warning'); return; }
  try{
    const invSnap = await getDoc(doc(db,'inventaires',inventaireId));
    if(!invSnap.exists()) return;
    const inv = invSnap.data();
    if(inv.valideParAdmin){ showToast("Cet inventaire est déjà archivé.", 'info'); loadInventaires(servanteId); return; }
    if(securiteCache.separationTaches && (inv.realiseParMatricule === currentUser.matricule || inv.clotureParMatricule === currentUser.matricule)){
      showToast("Séparation des tâches : vous avez réalisé cet inventaire, un autre responsable doit l'archiver.", 'warning');
      return;
    }
    const pages = opts.sansScan ? [] : await envoyerScanSigne(files);
    await appliquerEcartsInventaire(inv, inventaireId, servanteId);
    const nom = `${currentUser.prenom} ${currentUser.nom}`;
    await updateDoc(doc(db,'inventaires',inventaireId), {
      valideParAgent: true, valideParAgentMatricule: s.agentMatricule || null, valideParAgentNom: s.agentNom || 'Signature papier', valideParAgentLe: nowIso(),
      valideParAdmin: true, valideParAdminMatricule: currentUser.matricule, valideParAdminNom: nom, valideParAdminLe: nowIso(),
      scanPages: pages, scanLe: nowIso(), scanParNom: nom, scanParMatricule: currentUser.matricule, sansScan: !!opts.sansScan
    });
    updatePendingBadge();
    showToast(opts.sansScan ? "Inventaire archivé, écarts enregistrés." : "Scan archivé, écarts enregistrés.", 'success');
    if(currentServanteId === servanteId) renderServanteDetail(servanteId);
  }catch(err){
    showToast("Erreur lors de l'archivage : " + err.message, 'error');
  }
}

/* ============ PHOTOS D'OUTILS (Cloudinary) ============ */
const CLOUDINARY_CLOUD_NAME = "f4qguyzb";
const CLOUDINARY_UPLOAD_PRESET = "servantes_outillage";

function compressImage(file, maxDim=900, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Impossible de lire l'image."));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Fichier image invalide."));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob) reject(new Error("Échec de la compression de l'image."));
          else resolve(blob);
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhotoToCloudinary(file){
  return uploadBlobToCloudinary(await compressImage(file));
}

async function uploadBlobToCloudinary(compressed){
  const formData = new FormData();
  formData.append('file', compressed);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST', body: formData
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error("Échec de l'envoi de la photo. " + errText);
  }
  const data = await res.json();
  return data.secure_url;
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-src="${src}"]`)){ resolve(); return; }
    const el = document.createElement('script');
    el.src = src;
    el.dataset.src = src;
    el.onload = ()=>resolve();
    el.onerror = ()=>reject(new Error("Échec de chargement de " + src));
    document.head.appendChild(el);
  });
}

/* PDF -> images JPEG (une par page) : Cloudinary refuse de diffuser les PDF par défaut, les pages en image fonctionnent partout. */
async function pdfToJpegBlobs(file){
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const lib = window.pdfjsLib;
  if(!lib) throw new Error("Lecteur PDF indisponible (connexion ?).");
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdfDoc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const blobs = [];
  const n = Math.min(pdfDoc.numPages, 15);
  for(let i=1; i<=n; i++){
    const page = await pdfDoc.getPage(i);
    const v0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1700 / Math.max(v0.width, v0.height) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    blobs.push(await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8)));
  }
  return blobs;
}

async function envoyerScanSigne(files){
  openModal(`<div class="modal-head"><h3>Envoi du scan signé</h3></div><p id="scan-progress" style="font-size:14px;">Préparation…</p>`);
  const setP = t => { const el = document.getElementById('scan-progress'); if(el) el.textContent = t; };
  try{
    const blobs = [];
    for(const f of files){
      if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){ setP('Lecture du PDF…'); (await pdfToJpegBlobs(f)).forEach(b => blobs.push(b)); }
      else blobs.push(await compressImage(f, 1700, 0.8));
    }
    if(!blobs.length) throw new Error("Aucune page lisible dans ce fichier.");
    if(blobs.length > 15) throw new Error("Trop de pages (15 au maximum).");
    const urls = [];
    for(let i=0; i<blobs.length; i++){
      setP(`Envoi de la page ${i+1} / ${blobs.length}…`);
      urls.push(await uploadBlobToCloudinary(blobs[i]));
    }
    closeModal();
    return urls;
  }catch(e){ closeModal(); throw e; }
}

        }

  document.getElementById('scan-cancel').addEventListener('click', ()=>stopAndClose().then(()=>{ if(onCancel) onCancel(); }));

  loadHtml5Qrcode().then(Html5Qrcode => {
    _activeScanner = new Html5Qrcode("qr-reader");
    _activeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        const text = decodedText.trim();
        stopAndClose().then(()=> onResult(text));
      },
      ()=>{ /* frames sans code détecté : on ignore */ }
    ).catch(err => {
      const errEl = document.getElementById('scan-error');
      if(errEl){
        errEl.textContent = "Impossible d'accéder à la caméra : " + (err.message || err);
        errEl.style.display = 'block';
      }
    });
  }).catch(err => {
    const errEl = document.getElementById('scan-error');
    if(errEl){
      errEl.textContent = "Erreur de chargement du scanner : " + err.message;
      errEl.style.display = 'block';
    }
  });
}

async function fetchImageAsDataUrl(url){
  try{
    const small = url.includes('/upload/') ? url.replace('/upload/', '/upload/w_700,q_70/') : url;
    const res = await fetch(small);
    if(!res.ok) return null;
    const blob = await res.blob();
    return await new Promise((resolve)=>{
      const fr = new FileReader();
      fr.onload = ()=>resolve(fr.result);
      fr.onerror = ()=>resolve(null);
      fr.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}

async function downloadInventairePDF(inventaireId, servanteId){
  try{
    const s = servantesCache.find(x=>x.id===servanteId) || {};
    const invSnap = await getDoc(doc(db,'inventaires',inventaireId));
    if(!invSnap.exists()) return;
    const inv = invSnap.data();
    const JsPDF = await loadJsPDF();
    const pdf = new JsPDF({ unit: 'mm', format: 'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 14;
    const contentW = pageW - margin*2;
    const green = [0,166,81];
    const charcoal = [32,36,42];
    const steel = [91,101,112];
    const numero = s.agentMatricule || inv.numeroServante || inv.agentMatricule || '—';
    const resultats = inv.resultats || [];
    const enTrop = inv.enTrop || [];

    /* Bandeau d'en-tête */
    pdf.setFillColor(...charcoal);
    pdf.rect(0, 0, pageW, 20, 'F');
    pdf.setFillColor(...green);
    pdf.rect(0, 0, 4, 20, 'F');
    pdf.setTextColor(255,255,255);
    pdf.setFontSize(14);
    pdf.setFont(undefined, 'bold');
    pdf.text("FICHE D'INVENTAIRE", margin, 10);
    pdf.setFontSize(8.5);
    pdf.setFont(undefined, 'normal');
    pdf.text(`Servante d'outillage n° ${numero} — Gestion d'atelier`, margin, 16);
    pdf.setFontSize(7.5);
    pdf.text(formatDate(nowIso()).split(' à ')[0], pageW - margin, 16, { align: 'right' });

    /* Bloc informations (6 cases) */
    let y = 26;
    const boxH = 29;
    const colW = contentW / 2;
    pdf.setDrawColor(220,220,220);
    pdf.setFillColor(250,251,250);
    pdf.roundedRect(margin, y, contentW, boxH, 2, 2, 'FD');
    const infoRows = [
      ["Servante n°", String(numero)],
      ["Agent", `${s.agentNom || inv.agentNom || 'Non attribuée'}${(s.agentMatricule||inv.agentMatricule) ? ' ('+(s.agentMatricule||inv.agentMatricule)+')' : ''}`],
      ["Garage", s.garage || inv.garage || '—'],
      ["Date de l'inventaire", formatDate(inv.dateInventaire).split(' à ')[0]],
      ["Réalisé par (fonction)", `${inv.realiseParNom || '—'}${inv.realiseFonction ? ' — ' + inv.realiseFonction : ''}`],
      ["Début / fin", `${inv.debutLe ? formatDate(inv.debutLe) : '-'} au ${inv.termineLe ? formatDate(inv.termineLe) : '-'}`]
    ];
    infoRows.forEach((row, idx) => {
      const colX = margin + 6 + (idx % 2) * colW;
      const rowY = y + 7 + Math.floor(idx/2) * 9;
      pdf.setFontSize(6.5);
      pdf.setTextColor(...steel);
      pdf.text(row[0].toUpperCase(), colX, rowY);
      pdf.setFontSize(9);
      pdf.setTextColor(...charcoal);
      pdf.setFont(undefined, 'bold');
      pdf.text(pdf.splitTextToSize(String(row[1]), colW - 10)[0], colX, rowY + 4.5);
      pdf.setFont(undefined, 'normal');
    });
    y += boxH + 5;

    /* Synthèse : tuiles */
    const cnt = (v) => resultats.filter(r=>r.resultat===v).length;
    const surplusDe = (r) => (r.resultat === 'Conforme' && !r.retire && Number.isFinite(r.quantiteTrouvee)) ? Math.max(0, r.quantiteTrouvee - (r.quantiteAttendue||1)) : 0;
    const surplusTotal = resultats.reduce((n, r) => n + surplusDe(r), 0);
    const tuiles = [
      ['Outils pointés', resultats.length, charcoal], ['Conformes', cnt('Conforme') - resultats.filter(r => r.retire).length, [0,134,63]],
      ['Perdus', cnt('Manquant'), [214,69,69]], ['Cassés', cnt('Cassé'), [214,69,69]],
      ['Usés', cnt('Usé'), [143,100,18]], ['En trop', enTrop.length + surplusTotal, [143,100,18]]
    ];
    const tw = (contentW - 5*3) / 6;
    tuiles.forEach((t, i) => {
      const x = margin + i * (tw + 3);
      pdf.setDrawColor(220,224,220); pdf.setFillColor(250,251,250);
      pdf.roundedRect(x, y, tw, 13, 2, 2, 'FD');
      pdf.setFont(undefined, 'bold'); pdf.setFontSize(12); pdf.setTextColor(...t[2]);
      pdf.text(String(t[1]), x + tw/2, y + 6.5, { align: 'center' });
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...steel);
      pdf.text(t[0].toUpperCase(), x + tw/2, y + 10.8, { align: 'center' });
    });
    y += 13 + 6;

    const titre = (txt, yy) => {
      if(yy > pageH - 40){ pdf.addPage(); yy = 20; }
      pdf.setFont(undefined, 'bold'); pdf.setFontSize(10); pdf.setTextColor(...charcoal);
      pdf.text(txt, margin, yy);
      pdf.setDrawColor(...green); pdf.setLineWidth(0.6); pdf.line(margin, yy + 1.8, margin + 14, yy + 1.8); pdf.setLineWidth(0.2);
      pdf.setFont(undefined, 'normal');
      return yy + 5;
    };
    const nbTexte = (r) => r.retire ? '—' : `${Number.isFinite(r.quantiteTrouvee) ? r.quantiteTrouvee : (r.resultat === 'Conforme' ? (r.quantiteAttendue||1) : 0)} / ${r.quantiteAttendue||1}`;
    const commentaireDe = (r) => (r.quantiteOrig !== undefined && r.quantiteOrig !== r.quantiteAttendue ? `[quantité attendue corrigée : ${r.quantiteOrig} → ${r.quantiteAttendue}] `.replace('→', 'a') : '') + ((r.quantiteAttendue||1) > 1 && r.resultat !== 'Conforme' ? `[${(r.quantiteAttendue||1) - piecesEnEcart(r)}/${r.quantiteAttendue} conformes] ` : '') + (r.commentaire || '') + (r.photoUrl ? '  [photo en annexe]' : '');

    /* Écarts constatés (ce que la personne qui signe doit voir en premier) */
    const ecarts = resultats.filter(r => r.resultat && r.resultat !== 'Conforme');
    const surplus = resultats.filter(r => surplusDe(r) > 0);
    const retiresPdf = resultats.filter(r => r.retire);
    if(ecarts.length || enTrop.length || surplus.length || retiresPdf.length){
      y = titre('Écarts constatés', y);
      pdf.autoTable({
        startY: y, margin: { left: margin, right: margin }, tableWidth: contentW, rowPageBreak: 'avoid',
        head: [["Outil", "Référence", "Nombre", "Mention", "Explication"]],
        body: [
          ...ecarts.map(r => [r.designation, r.reference, nbTexte(r), libEcart(r.resultat), commentaireDe(r)]),
          ...surplus.map(r => [r.designation, r.reference, nbTexte(r), 'En trop', `${surplusDe(r)} pièce${surplusDe(r)>1?'s':''} en plus de la dotation`]),
          ...retiresPdf.map(r => [r.designation, r.reference, '—', 'Hors dotation', "L'agent ne possède pas cet outil : retiré de la dotation"]),
          ...enTrop.map(e => [e.designation, e.reference || '—', String(e.quantite || 1), e.ajouter === true ? 'Ajouté' : 'En trop', (e.ajouter === true ? "Ajouté à la dotation. " : '') + (e.commentaire||'') + (e.photoUrl ? '  [photo en annexe]' : '')])
        ],
        theme: 'grid',
        styles: { fontSize: 7.5, cellPadding: 1.5, lineColor: [225,228,225], lineWidth: 0.2, overflow: 'linebreak', valign: 'middle' },
        headStyles: { fillColor: [214,69,69], textColor: 255, fontStyle: 'bold', fontSize: 7.5 },
        columnStyles: { 0:{cellWidth:'auto'}, 1:{cellWidth:28}, 2:{cellWidth:20, halign:'center'}, 3:{cellWidth:20, fontStyle:'bold', halign:'center'}, 4:{cellWidth:54} },
        didParseCell: (d) => {
          if(d.section === 'body' && d.column.index === 3){
            const v = d.cell.text.join('');
            d.cell.styles.textColor = (v === 'Usé' || v === 'En trop' || v === 'Ajouté') ? [143,100,18] : (v === 'Hors dotation' ? [91,101,112] : [214,69,69]);
          }
        }
      });
      y = pdf.lastAutoTable.finalY + 7;
    }

    /* Évolution depuis l'inventaire précédent */
    try{
      const tousInv = await getDocs(query(collection(db,'inventaires'), where('servanteId','==',servanteId)));
      const prev = inventairePrecedent(tousInv.docs.map(d => ({ id: d.id, ...d.data() })), { ...inv, id: inventaireId });
      if(prev){
        const c = comparerInventaires(inv, prev);
        y = titre(`Depuis l'inventaire du ${formatDate(prev.dateInventaire).split(' à ')[0]}`, y);
        const lignesC = [
          ...c.changements.map(x => [x.r.designation, x.r.reference, libEtat(x.avant), libEtat(x.apres)]),
          ...c.ajoutes.map(x => [x.r.designation, x.r.reference, '—', 'Ajouté à la dotation']),
          ...c.disparus.map(x => [x.r.designation, x.r.reference, libEtat(x.avant), 'Plus en dotation'])
        ];
        if(!lignesC.length){
          pdf.setFontSize(8.5); pdf.setFont(undefined, 'normal'); pdf.setTextColor(...steel);
          pdf.text('Aucun changement.' + (c.retiresEcart ? ` ${c.retiresEcart} outil${c.retiresEcart>1?'s':''} retiré${c.retiresEcart>1?'s':''} suite aux écarts précédents.` : ''), margin, y + 1);
          y += 8;
        } else {
          const reste = lignesC.length - 30;
          pdf.autoTable({
            startY: y, margin: { left: margin, right: margin }, tableWidth: contentW, rowPageBreak: 'avoid',
            head: [["Outil", "Référence", "Avant", "Maintenant"]],
            body: lignesC.slice(0, 30),
            theme: 'grid',
            styles: { fontSize: 7.5, cellPadding: 1.4, lineColor: [225,228,225], lineWidth: 0.2, overflow: 'linebreak', valign: 'middle' },
            headStyles: { fillColor: [70,78,88], textColor: 255, fontStyle: 'bold', fontSize: 7.5 },
            columnStyles: { 0:{cellWidth:'auto'}, 1:{cellWidth:30}, 2:{cellWidth:34}, 3:{cellWidth:40} }
          });
          y = pdf.lastAutoTable.finalY + 3;
          const notes = [];
          if(reste > 0) notes.push(`… et ${reste} autre${reste>1?'s':''} changement${reste>1?'s':''}.`);
          if(c.retiresEcart) notes.push(`${c.retiresEcart} outil${c.retiresEcart>1?'s':''} retiré${c.retiresEcart>1?'s':''} de la dotation suite aux écarts précédents.`);
          if(notes.length){ pdf.setFontSize(7.5); pdf.setFont(undefined, 'normal'); pdf.setTextColor(...steel); pdf.text(notes.join(' '), margin, y + 2); y += 4; }
          y += 5;
        }
      }
    }catch(e){ /* comparaison facultative : le PDF reste généré */ }

    /* Détail par type d'outil : catégorie > sous-catégorie */
    y = titre("Détail par type d'outil", y);
    const outilParId = new Map(outilsCache.map(o => [o.id, o]));
    const ordreCat = (nom) => { const i = categoriesCache.findIndex(c => c.nom === nom); return i < 0 ? 999 : i; };
    const ordreSous = (cat, nom) => { const c = categoriesCache.find(x => x.nom === cat); const i = c ? (c.sousCategories||[]).findIndex(x => x.nom === nom) : -1; return !nom ? 998 : (i < 0 ? 997 : i); };
    const enrichis = resultats.map(r => ({ r, cat: r.categorie || 'Autres outils', sous: (outilParId.get(r.outilId) || {}).sousCategorie || '' }));
    enrichis.sort((a, b) =>
      ordreCat(a.cat) - ordreCat(b.cat) || a.cat.localeCompare(b.cat, 'fr') ||
      ordreSous(a.cat, a.sous) - ordreSous(b.cat, b.sous) || a.sous.localeCompare(b.sous, 'fr') ||
      ((a.r.ordre||999999) - (b.r.ordre||999999)) || String(a.r.designation).localeCompare(String(b.r.designation), 'fr', { numeric: true }));
    const corps = [];
    let derCat = null, derSous = null;
    enrichis.forEach(({ r, cat, sous }) => {
      if(cat !== derCat){
        const dansCat = enrichis.filter(x => x.cat === cat);
        const nEc = dansCat.filter(x => x.r.resultat && x.r.resultat !== 'Conforme').length;
        corps.push([{ content: `${cat.toUpperCase()}   ·   ${dansCat.length} outil${dansCat.length>1?'s':''}${nEc ? `   ·   ${nEc} écart${nEc>1?'s':''}` : ''}`,
                      colSpan: 5, styles: { fillColor: charcoal, textColor: 255, fontStyle: 'bold', fontSize: 8, cellPadding: { top: 1.1, bottom: 1.1, left: 1.5, right: 1.5 } } }]);
        derCat = cat; derSous = null;
      }
      if(sous && sous !== derSous){
        corps.push([{ content: sous, colSpan: 5, styles: { fillColor: [225,231,225], textColor: charcoal, fontStyle: 'bold', fontSize: 7, cellPadding: { top: 0.5, bottom: 0.5, left: 1.5, right: 1.5 } } }]);
      }
      derSous = sous;
      const ecart = r.resultat && r.resultat !== 'Conforme';
      const fill = ecart ? (r.resultat === 'Usé' ? [253,246,225] : [253,236,236]) : null;
      const c = (content, extra = {}) => ({ content, styles: { ...(fill ? { fillColor: fill } : {}), ...extra } });
      const sp = surplusDe(r);
      corps.push([
        c(r.reference, { font: 'courier', fontSize: 6.5 }),
        c(r.designation + ((r.quantiteAttendue||1) > 1 ? ' x' + r.quantiteAttendue : '')),
        c(nbTexte(r), { halign: 'center' }),
        c((r.retire ? 'Hors dotation' : ((libEcart(r.resultat) || '—') + (sp ? ` (+${sp})` : ''))), { halign: 'center', fontStyle: 'bold' }),
        c(commentaireDe(r))
      ]);
    });
    pdf.autoTable({
      startY: y, margin: { left: margin, right: margin, bottom: 14, top: 12 }, tableWidth: contentW, rowPageBreak: 'avoid',
      head: [["Référence", "Désignation", "Nombre", "Résultat", "Commentaire"]],
      body: corps,
      theme: 'grid',
      styles: { fontSize: 7, cellPadding: { top: 0.4, bottom: 0.4, left: 1.5, right: 1.5 }, lineColor: [225,228,225], lineWidth: 0.15, overflow: 'linebreak', valign: 'middle' },
      headStyles: { fillColor: [70,78,88], textColor: 255, fontStyle: 'bold', halign: 'left', fontSize: 7 },
      columnStyles: { 0:{cellWidth:30}, 1:{cellWidth:'auto'}, 2:{cellWidth:20, halign:'center'}, 3:{cellWidth:24}, 4:{cellWidth:45} },
      didParseCell: (d) => {
        if(d.section === 'body' && d.column.index === 3 && d.cell.colSpan === 1){
          const v = d.cell.text.join('');
          if(v.startsWith('Conforme')) d.cell.styles.textColor = [0,134,63];
          else if(v.startsWith('Usé')) d.cell.styles.textColor = [143,100,18];
          else if(v.startsWith('Cassé') || v.startsWith('Perdu')) d.cell.styles.textColor = [214,69,69];
        }
      }
    });
    let finalY = pdf.lastAutoTable.finalY + 8;

    /* Statut du document + signatures, en bas de la dernière page */
    const archive = !!(inv.valideParAgent && inv.valideParAdmin);
    const enCours = inv.brouillon === true;
    const boxColor = archive ? green : (enCours ? [214,69,69] : [197,138,18]);
    const statutTxt = enCours
      ? "INVENTAIRE EN COURS — non clôturé : ne pas faire signer ce document"
      : (archive
        ? `Inventaire archivé le ${formatDate(inv.valideParAdminLe).split(' à ')[0]}${inv.sansScan ? ' (sans scan signé)' : ' — scan signé conservé dans l\'application'}`
        : "À faire signer par l'agent et par la personne qui a réalisé l'inventaire, puis à scanner et archiver dans l'application");
    const sigH = 34;
    const sigY = pageH - 15 - sigH;
    if(finalY > sigY - 16){ pdf.addPage(); finalY = 20; }
    const statutY = sigY - 14;
    pdf.setDrawColor(...boxColor);
    pdf.setFillColor(...(archive ? [228,246,236] : (enCours ? [251,231,231] : [253,246,225])));
    pdf.roundedRect(margin, statutY, contentW, 10, 2, 2, 'FD');
    pdf.setFontSize(8.5);
    pdf.setFont(undefined, 'bold');
    pdf.setTextColor(...(archive ? [0,134,63] : (enCours ? [214,69,69] : [143,100,18])));
    pdf.text(pdf.splitTextToSize(statutTxt, contentW - 12)[0], margin + 5, statutY + 6.3);

    const sigW = (contentW - 6) / 2;
    const fonction = inv.realiseFonction || 'Responsable';
    const sigs = [
      ["Agent — propriétaire de la servante", `Nom : ${s.agentNom || inv.agentNom || ''}`],
      [`${fonction} — a réalisé l'inventaire`, `Nom : ${inv.realiseParNom || ''}`]
    ];
    sigs.forEach((sg, i) => {
      const x = margin + i * (sigW + 6);
      pdf.setDrawColor(150,150,150);
      pdf.setFillColor(255,255,255);
      pdf.roundedRect(x, sigY, sigW, sigH, 2, 2, 'D');
      pdf.setFontSize(7.5); pdf.setTextColor(...steel); pdf.setFont(undefined, 'bold');
      pdf.text(sg[0].toUpperCase(), x + 3, sigY + 5, { maxWidth: sigW - 6 });
      pdf.setFont(undefined, 'normal'); pdf.setFontSize(9); pdf.setTextColor(...charcoal);
      pdf.text(sg[1], x + 3, sigY + 12, { maxWidth: sigW - 6 });
      pdf.text('Date : ____ / ____ / ________', x + 3, sigY + 19);
      pdf.setFontSize(7.5); pdf.setTextColor(...steel);
      pdf.text('Signature :', x + 3, sigY + 26);
    });

    /* Annexe photos */
    const photos = [];
    resultats.forEach(r => { if(r.photoUrl) photos.push({ url:r.photoUrl, legend:`${r.designation} (${r.reference}) — ${libEcart(r.resultat)}${r.commentaire ? ' : ' + r.commentaire : ''}` }); });
    enTrop.forEach(e => { if(e.photoUrl) photos.push({ url:e.photoUrl, legend:`Outil en trop : ${e.designation}${e.commentaire ? ' — ' + e.commentaire : ''}` }); });
    if(photos.length){
      pdf.addPage();
      let py = 20;
      pdf.setFontSize(12); pdf.setFont(undefined, 'bold'); pdf.setTextColor(...charcoal);
      pdf.text('Annexe — photos jointes', margin, py);
      pdf.setFont(undefined, 'normal');
      py += 8;
      for(const p of photos){
        const data = await fetchImageAsDataUrl(p.url);
        if(py + 62 > pageH - 14){ pdf.addPage(); py = 20; }
        if(data){
          try{ pdf.addImage(data, 'JPEG', margin, py, 62, 46); }catch(e){}
        }
        pdf.setFontSize(9); pdf.setTextColor(...charcoal);
        pdf.text(pdf.splitTextToSize(p.legend, contentW - 70), margin + 68, py + 6);
        py += 54;
      }
    }

    /* Pied de page */
    const pages = pdf.internal.getNumberOfPages();
    for(let i=1; i<=pages; i++){
      pdf.setPage(i);
      pdf.setFont(undefined, 'normal');
      pdf.setTextColor(...steel);
      pdf.setFontSize(7);
      pdf.text(`Servante n° ${numero} — document généré le ${formatDate(nowIso()).split(' à ')[0]}`, margin, pageH - 8);
      pdf.text(`Page ${i} / ${pages}`, pageW - margin, pageH - 8, { align: 'right' });
    }

    pdf.save(`inventaire_servante_${numero}_${String(inv.dateInventaire).slice(0,10)}.pdf`);
  }catch(err){
    showToast("Erreur lors de la génération du PDF : " + err.message, 'error');
  }
}

/* ============ INVENTAIRE : brouillon, preuves, outils en trop ============ */
function findDraftInventaire(servanteId){
  return inventairesAllCache.find(i => i.servanteId === servanteId && i.brouillon === true) || null;
}

function openInventaireModal(servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
  if(!s) return;
  const draft = findDraftInventaire(servanteId);
  if(draft){ openInventaireEditor(servanteId, draft.id, draft); return; }
  const outils = (s.outilsAssignes||[]).filter(t=>t.actif);
  if(!outils.length){
    openModal(`
      <div class="modal-head"><h3>Nouvel inventaire</h3><button class="modal-close" id="m-close">&times;</button></div>
      <p style="font-size:13.5px;color:var(--steel);">Cette servante n'a aucun outil en dotation à inventorier.</p>
      <div class="modal-actions"><button class="btn btn-secondary" id="m-cancel">Fermer</button></div>
    `);
    document.getElementById('m-close').addEventListener('click', closeModal);
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    return;
  }
  const data = {
    servanteId, numeroServante: s.agentMatricule || null,
    agentMatricule: s.agentMatricule || null, agentNom: s.agentNom || null, garage: s.garage || null,
    brouillon: true, debutLe: nowIso(), dateInventaire: nowIso(),
    realiseParMatricule: currentUser.matricule, realiseParNom: `${currentUser.prenom} ${currentUser.nom}`,
    resultats: outils.slice().sort((a,b)=> (a.ordre||999999)-(b.ordre||999999)).map(t => ({
      localId: t.localId, outilId: t.outilId, reference: t.reference, designation: t.designation,
      categorie: t.categorie || '', groupe: t.groupe || '', ordre: t.ordre || 0,
      quantiteAttendue: t.quantite || 1, quantiteTrouvee: null, resultat: null, commentaire: '', photoUrl: ''
    })),
    enTrop: [],
    valideParAgent:false, valideParAgentMatricule:null, valideParAgentNom:null, valideParAgentLe:null,
    valideParAdmin:false, valideParAdminMatricule:null, valideParAdminNom:null, valideParAdminLe:null
  };
  const roleTxt = String(currentUser.role || '').toLowerCase();
  demanderRealisateur({
    prenom: currentUser.prenom, nom: currentUser.nom,
    fonction: (()=>{ try{ const m = localStorage.getItem('sv_fonction_' + currentUser.matricule); if(m) return m; }catch(e){} return /magasin/.test(roleTxt) ? 'Magasinier' : (/brigadier/.test(roleTxt) ? 'Brigadier' : ''); })()
  }, (r) => {
    try{ localStorage.setItem('sv_fonction_' + currentUser.matricule, r.fonction); }catch(e){}
    data.realiseParNom = `${r.prenom} ${r.nom}`.trim();
    data.realiseParPrenom = r.prenom; data.realiseParNomFamille = r.nom; data.realiseFonction = r.fonction;
    addDoc(collection(db,'inventaires'), data)
      .then(ref => openInventaireEditor(servanteId, ref.id, data))
      .catch(err => showToast("Impossible de démarrer l'inventaire : " + err.message, 'error'));
  });
}

/* Nom, prénom et fonction de la personne qui réalise (et signera) l'inventaire. */
function demanderRealisateur(def, onOk, onCancel){
  const fonctions = ['Magasinier', 'Brigadier'];
  const estAutre = !!def.fonction && !fonctions.includes(def.fonction);
  openModal(`
    <div class="modal-head"><h3>Qui réalise l'inventaire ?</h3><button class="modal-close" id="m-close">&times;</button></div>
    <p style="font-size:13px;color:var(--steel);margin-bottom:12px;">Cette personne apparaîtra sur le PDF et le signera.</p>
    <div class="modal-error" id="rl-error"></div>
    <div class="field-row">
      <div class="field"><label>Prénom</label><input type="text" id="rl-prenom" class="uc-input" value="${escapeHtml(def.prenom||'')}"></div>
      <div class="field"><label>Nom</label><input type="text" id="rl-nom" class="uc-input" value="${escapeHtml(def.nom||'')}"></div>
    </div>
    <div class="field"><label>Fonction</label>
      <select id="rl-fonction">
        <option value="">Choisir…</option>
        ${fonctions.map(f=>`<option ${def.fonction===f?'selected':''}>${f}</option>`).join('')}
        <option value="__autre" ${estAutre?'selected':''}>Autre</option>
      </select>
    </div>
    <div class="field" id="rl-autre-box" style="${estAutre?'':'display:none;'}"><label>Précisez la fonction</label><input type="text" id="rl-autre" value="${estAutre ? escapeHtml(def.fonction) : ''}"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
      <button type="button" class="btn btn-primary" id="rl-ok">Continuer</button>
    </div>`);
  const annuler = ()=>{ closeModal(); if(onCancel) onCancel(); };
  document.getElementById('m-close').addEventListener('click', annuler);
  document.getElementById('m-cancel').addEventListener('click', annuler);
  document.getElementById('rl-fonction').addEventListener('change', (e)=>{
    document.getElementById('rl-autre-box').style.display = e.target.value === '__autre' ? '' : 'none';
  });
  document.getElementById('rl-ok').addEventListener('click', ()=>{
    const prenom = sanitizeInput(document.getElementById('rl-prenom').value).toUpperCase();
    const nom = sanitizeInput(document.getElementById('rl-nom').value).toUpperCase();
    let fonction = document.getElementById('rl-fonction').value;
    if(fonction === '__autre') fonction = sanitizeInput(document.getElementById('rl-autre').value);
    const err = document.getElementById('rl-error');
    if(!prenom || !nom || !fonction){ err.textContent = "Renseignez le prénom, le nom et la fonction."; err.style.display = 'block'; return; }
    closeModal();
    onOk({ prenom, nom, fonction });
  });
}

function defautRealisateur(src){
  const parts = String(src.realiseParNom || '').trim().split(/\s+/);
  return {
    prenom: src.realiseParPrenom || parts[0] || '',
    nom: src.realiseParNomFamille || parts.slice(1).join(' ') || '',
    fonction: src.realiseFonction || ''
  };
}

  function refreshRow(id){

    const row = $(`[data-row="${id}"]`); if(!row) return;
    row.querySelectorAll('[data-set]').forEach(b => b.classList.toggle('sel', !r.retire && b.dataset.set === r.resultat));

          <label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" data-trop-check="1" data-id="${e.id}" ${e.ajouter !== false ? 'checked' : ''}> Ajouter à la dotation de la servante</label>
        </div>

          <label>Catégorie (si l'outil n'existe pas encore au catalogue, il y sera ajouté)
            <select data-trop-field="categorie" data-id="${e.id}" style="margin-left:6px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;">
              ${categoriesCache.map(c => `<option ${((e.categorie || 'Accessoires') === c.nom) ? 'selected' : ''}>${escapeHtml(c.nom)}</option>`).join('')}
            </select>
          </label>
        </div>
        <textarea rows="2" data-trop-field="commentaire" data-id="${e.id}" placeholder="Commentaire (d'où vient cet outil ?)" style="width:100%;margin-top:6px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;">${escapeHtml(e.commentaire||'')}</textarea>
        <div class="inv-photo-line">
          <button type="button" class="btn btn-secondary btn-sm" data-trop-photo="${e.id}">📷 Photo</button>
          ${e.photoUrl ? `<img class="inv-thumb" src="${escapeHtml(e.photoUrl)}" alt="photo">` : ''}
          <button type="button" class="btn btn-secondary btn-sm" data-trop-del="${e.id}" style="margin-left:auto;">Supprimer</button>
        </div>
      </div>`).join('') + `<datalist id="inv-catalogue-list">${outilsCache.map(o=>`<option value="${escapeHtml(o.designation)}">${escapeHtml(o.reference)}</option>`).join('')}</datalist>`;
  }

  // --- clics sur la liste (délégation)
  $('#inv-list').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-set]');
    const plus = e.target.closest('[data-more]');
    if(plus){
      e.preventDefault();
      const box = $(`[data-qtybox="${plus.dataset.more}"]`);
      if(box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
      return;
    }
    const lr = e.target.closest('[data-retire]');
    if(lr){
      e.preventDefault();
      const r = rowOf(lr.dataset.retire);
      if(r.ajoute){
        state.resultats = state.resultats.filter(x => x !== r);
        const rowEl = $(`[data-row="${r.localId}"]`); if(rowEl) rowEl.remove();
        refreshProgress(); scheduleSave();
        return;
      }
      if(r.retire){ r.retire = false; r.resultat = null; r.quantiteTrouvee = null; }
      else { r.retire = true; r.resultat = 'Conforme'; r.commentaire = ''; r.photoUrl = ''; r.quantiteTrouvee = r.quantiteAttendue; }
      refreshRow(r.localId); refreshProgress(); scheduleSave();
      return;
    }
    if(b){
      const r = rowOf(b.dataset.for);
      r.retire = false;
      r.resultat = b.dataset.set;
      if(r.resultat === 'Conforme'){ r.commentaire = ''; r.photoUrl = ''; }
      if(r.resultat === 'Conforme') r.quantiteTrouvee = Math.max(r.quantiteAttendue, r.quantiteTrouvee || 0);
      else if(r.quantiteTrouvee === null || r.quantiteTrouvee === undefined || r.quantiteTrouvee >= r.quantiteAttendue) r.quantiteTrouvee = 0;
      refreshRow(r.localId); refreshProgress(); scheduleSave();
      return;
    }
    const ph = e.target.closest('[data-photo]');
    if(ph){ photoTarget = { type:'row', id: ph.dataset.photo }; $('#inv-photo-input').click(); return; }
    const del = e.target.closest('[data-photo-del]');
    if(del){ e.preventDefault(); const r = rowOf(del.dataset.photoDel); r.photoUrl = ''; refreshRow(r.localId); scheduleSave(); }
  });
  $('#inv-list').addEventListener('input', (e)=>{
    const ai = e.target.closest('[data-att]');
    if(ai){
      const r = rowOf(ai.dataset.att);
      const n = parseInt(ai.value, 10);
      if(Number.isFinite(n) && n >= 1){
        if(r.quantiteOrig === undefined) r.quantiteOrig = r.quantiteAttendue;
        r.quantiteAttendue = n;
        if(r.quantiteOrig === n) delete r.quantiteOrig;
        if(!r.retire){
          if(r.quantiteTrouvee === null || r.quantiteTrouvee === undefined){ if(r.resultat === 'Conforme') r.quantiteTrouvee = n; }
          else if(r.quantiteTrouvee >= n){ r.resultat = 'Conforme'; r.commentaire = ''; r.photoUrl = ''; }
          else if(!r.resultat || r.resultat === 'Conforme') r.resultat = 'Manquant';
        } else r.quantiteTrouvee = n;
        refreshRow(r.localId); refreshProgress(); scheduleSave();
      }
      return;
    }
    const qi = e.target.closest('[data-qty]');
    if(qi){
      const r = rowOf(qi.dataset.qty);
      r.retire = false;
      let n = parseInt(qi.value, 10);
      if(Number.isNaN(n)){ r.quantiteTrouvee = null; }
      else {
        n = Math.max(0, n);
        r.quantiteTrouvee = n;
        if(n >= r.quantiteAttendue){ r.resultat = 'Conforme'; r.commentaire = ''; r.photoUrl = ''; }
        else if(!r.resultat || r.resultat === 'Conforme') r.resultat = 'Manquant';
      }
      refreshRow(r.localId); refreshProgress(); scheduleSave();
      return;
    }
    const t = e.target.closest('[data-comment]');
    if(t){ const r = rowOf(t.dataset.comment); r.commentaire = t.value; t.classList.remove('err'); scheduleSave(); }
  });

  // --- outils en trop
  // (l'ajout d'un outil se fait maintenant par « + Ajouter un outil » : la ligne apparaît dans la liste)
  $('#inv-trop-list').addEventListener('input', (e)=>{
    const f = e.target.closest('[data-trop-field]'); if(!f) return;
    const item = state.enTrop.find(x => x.id === f.dataset.id); if(!item) return;
    item[f.dataset.tropField] = f.value;
    if(f.dataset.tropField === 'quantite') item.quantite = Math.max(1, parseInt(f.value, 10) || 1);
    if(f.dataset.tropField === 'designation'){
      const o = outilsCache.find(x => x.designation === f.value);
      if(o){ item.reference = o.reference; item.outilId = o.id; const refInput = $(`[data-trop-field="reference"][data-id="${item.id}"]`); if(refInput) refInput.value = o.reference; }
    }
    scheduleSave();
  });
  $('#inv-trop-list').addEventListener('change', (e)=>{
    const c = e.target.closest('[data-trop-check]'); if(!c) return;
    const it = state.enTrop.find(x => x.id === c.dataset.id);
    if(it){ it.ajouter = c.checked; scheduleSave(); }
  });
  $('#inv-trop-list').addEventListener('click', (e)=>{
    const d = e.target.closest('[data-trop-del]');
    if(d){ state.enTrop = state.enTrop.filter(x => x.id !== d.dataset.tropDel); drawTrop(); scheduleSave(); return; }
    const p = e.target.closest('[data-trop-photo]');
    if(p){ photoTarget = { type:'trop', id: p.dataset.tropPhoto }; $('#inv-photo-input').click(); }
  });

  // --- photo
  $('#inv-photo-input').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file || !photoTarget) return;
    const target = photoTarget; photoTarget = null;
    setState('Envoi de la photo…');
    try{
      const url = await uploadPhotoToCloudinary(file);
      if(target.type === 'row'){ const r = rowOf(target.id); r.photoUrl = url; refreshRow(r.localId); }
      else { const it = state.enTrop.find(x => x.id === target.id); if(it){ it.photoUrl = url; drawTrop(); } }
      scheduleSave();
    }catch(err){
      setState('⚠ ' + err.message, true);
    }
  });

  // --- qui réalise l'inventaire
  $('#inv-who').addEventListener('click', async ()=>{
    await flushSave();
    const retour = (extra) => openInventaireEditor(servanteId, invId, { ...invData, ...(extra||{}), resultats: state.resultats, enTrop: state.enTrop, dateInventaire: dateInputToIso(state.date) });
    demanderRealisateur(defautRealisateur(invData), async (r)=>{
      const upd = { realiseParNom: `${r.prenom} ${r.nom}`.trim(), realiseParPrenom: r.prenom, realiseParNomFamille: r.nom, realiseFonction: r.fonction };
      try{ await updateDoc(doc(db,'inventaires',invId), upd); }catch(err){ showToast("Erreur : " + err.message, 'error'); }
      retour(upd);
    }, () => retour());
  });

  // --- date de l'inventaire
  $('#inv-date').addEventListener('change', (e)=>{ if(e.target.value){ state.date = e.target.value; scheduleSave(); } });

  // --- recherche / filtres / tout conforme
  $('#inv-search').addEventListener('input', applyFilter);
  document.querySelectorAll('.inv-chip').forEach(c => c.addEventListener('click', ()=>{
    activeFilter = c.dataset.filter;
    document.querySelectorAll('.inv-chip').forEach(x => x.classList.toggle('on', x === c));
    applyFilter();
  }));
  $('#inv-all-ok').addEventListener('click', ()=>{
    const restants = state.resultats.filter(r => !r.resultat);
    if(!restants.length){ showToast("Tous les outils sont déjà pointés.", 'info'); return; }
    restants.forEach(r => { r.resultat = 'Conforme'; if(r.quantiteTrouvee === null || r.quantiteTrouvee === undefined) r.quantiteTrouvee = r.quantiteAttendue; refreshRow(r.localId); });
    refreshProgress(); scheduleSave();
    showToast(`${restants.length} outil${restants.length>1?'s':''} marqué${restants.length>1?'s':''} conforme${restants.length>1?'s':''}. Corrigez ceux qui ne le sont pas.`, 'success');
  });

  // --- ajouter un outil à l'inventaire (catalogue ou nouvel outil) : la ligne apparaît tout de suite dans la liste
  $('#inv-add-outil').addEventListener('click', async ()=>{
    await flushSave();
    const reouvrir = (focus) => openInventaireEditor(servanteId, invId, { ...invData, resultats: state.resultats, enTrop: state.enTrop, dateInventaire: dateInputToIso(state.date) }, focus ? { focusLocal: focus } : undefined);
    const presents = () => new Set(state.resultats.map(r => r.outilId).filter(Boolean));
    const absents = () => { const pr = presents(); return outilsCache.filter(o => !pr.has(o.id)); };
    const nouvelleLigne = (o, q, extra) => {
      const ligne = { localId: uid(), outilId: o.id || null, reference: o.reference || '', designation: o.designation, categorie: o.categorie || '',
                      groupe: "AJOUTÉS PENDANT L'INVENTAIRE", ordre: -1, quantiteAttendue: q, quantiteTrouvee: q, resultat: 'Conforme',
                      commentaire: '', photoUrl: '', ajoute: true, ...(extra || {}) };
      state.resultats.push(ligne);
      return ligne.localId;
    };
    openModal(`
      <div class="modal-head"><h3>Ajouter un outil à l'inventaire</h3><button class="modal-close" id="m-close">&times;</button></div>
      <p style="font-size:13px;color:var(--steel);margin-bottom:10px;">L'agent possède un outil qui n'est pas dans la liste ? Cherchez-le au catalogue, ou créez-le. Il apparaîtra en haut de la liste.</p>
      <input type="search" id="aj-search" placeholder="Rechercher au catalogue (nom, référence)…" autocomplete="off" style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;">
      <div id="aj-results" style="max-height:32vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;"></div>
      <div id="aj-all" style="margin-top:8px;"></div>
      <details style="margin-top:12px;"><summary style="cursor:pointer;font-weight:700;">L'outil n'existe pas au catalogue : le créer</summary>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:8px;">
          <input type="text" id="aj-des" placeholder="Désignation" style="padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <input type="text" id="aj-ref" placeholder="Référence (si connue)" style="flex:1;min-width:130px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;">
            <select id="aj-cat" style="flex:1;min-width:130px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;">${categoriesCache.map(c => `<option ${c.nom === 'Accessoires' ? 'selected' : ''}>${escapeHtml(c.nom)}</option>`).join('')}</select>
            <input type="number" id="aj-qte" min="1" step="1" value="1" style="width:80px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;" title="Quantité">
          </div>
          <div class="modal-error" id="aj-error"></div>
          <button type="button" class="btn btn-primary" id="aj-create">Créer et ajouter à l'inventaire</button>
        </div>
      </details>
      <div class="modal-actions"><button type="button" class="btn btn-secondary" id="m-cancel">Retour à l'inventaire</button></div>`);
    const dessiner = () => {
      const q = (document.getElementById('aj-search').value || '').trim().toLowerCase();
      const liste = absents().filter(o => !q || [o.designation, o.reference, o.categorie].join(' ').toLowerCase().includes(q))
                             .sort((a,b)=> String(a.designation).localeCompare(String(b.designation), 'fr', { numeric:true }));
      document.getElementById('aj-results').innerHTML = liste.slice(0, 40).map(o => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);">
          <div><div style="font-weight:700;font-size:14px;">${escapeHtml(o.designation)}</div><div style="font-size:12px;color:var(--steel);">${escapeHtml(o.reference||'')} · ${escapeHtml(o.categorie||'')}</div></div>
          <button type="button" class="btn btn-primary btn-sm" data-aj="${o.id}">Ajouter</button>
        </div>`).join('') || `<div class="empty-state" style="padding:14px;"><p>${q ? 'Aucun outil du catalogue ne correspond.' : 'Tous les outils du catalogue sont déjà dans cet inventaire.'}</p></div>`;
      const n = absents().length;
      document.getElementById('aj-all').innerHTML = (!q && n > 1) ? `<button type="button" class="btn btn-secondary btn-sm" id="aj-tous">Ajouter les ${n} outils du catalogue qui manquent à cette servante</button>` : '';
    };
    dessiner();
    document.getElementById('aj-search').addEventListener('input', dessiner);
    document.getElementById('aj-results').addEventListener('click', async (ev)=>{
      const b = ev.target.closest('[data-aj]'); if(!b) return;
      const o = outilsCache.find(x => x.id === b.dataset.aj); if(!o) return;
      const lid = nouvelleLigne(o, Math.max(1, o.quantiteStandard || 1));
      await flushSave(); reouvrir(lid);
    });
    document.getElementById('aj-all').addEventListener('click', async (ev)=>{
      if(!ev.target.closest('#aj-tous')) return;
      absents().forEach(o => nouvelleLigne(o, Math.max(1, o.quantiteStandard || 1)));
      await flushSave(); reouvrir();
    });
    document.getElementById('aj-create').addEventListener('click', async ()=>{
      const des = sanitizeInput(document.getElementById('aj-des').value).toUpperCase();
      const err = document.getElementById('aj-error');
      if(des.length < 2){ err.textContent = "Indiquez la désignation de l'outil."; err.style.display = 'block'; return; }
      const cat = document.getElementById('aj-cat').value;
      const q = Math.max(1, parseInt(document.getElementById('aj-qte').value, 10) || 1);
      const lid = nouvelleLigne({ designation: des, reference: sanitizeInput(document.getElementById('aj-ref').value).toUpperCase(), categorie: cat }, q, { categorieNouvelle: cat });
      await flushSave(); reouvrir(lid);
    });
    document.getElementById('m-close').addEventListener('click', ()=>reouvrir());
    document.getElementById('m-cancel').addEventListener('click', ()=>reouvrir());
  });

  // --- scan
  $('#inv-scan').addEventListener('click', async ()=>{
    await flushSave();
    const reopen = (code)=>{
      openInventaireEditor(servanteId, invId, { ...invData, resultats: state.resultats, enTrop: state.enTrop, dateInventaire: dateInputToIso(state.date) }, { focusCode: code });
    };
    openScanModal((code)=> reopen(code), ()=> reopen(null));
  });

  $('#inv-pdf').addEventListener('click', async ()=>{
    setState('Création du PDF…');
    await flushSave();
    await downloadInventairePDF(invId, servanteId);
    setState('PDF téléchargé.');
  });

  // --- fermer / abandonner
  async function closeEditor(){ await flushSave(); closeModal(); if(currentServanteId === servanteId) setTimeout(()=>renderServanteDetail(servanteId), 250); }
  $('#m-close').addEventListener('click', closeEditor);
  $('#inv-save-close').addEventListener('click', async ()=>{ await closeEditor(); showToast("Brouillon enregistré. Vous pourrez le reprendre à tout moment.", 'success'); });
  $('#inv-discard').addEventListener('click', ()=>{
    showConfirmModal("Abandonner définitivement cet inventaire en cours ? Tout le pointage sera perdu.", async ()=>{
      clearTimeout(saveTimer);
      try{ await deleteDoc(doc(db,'inventaires',invId)); }catch(err){ showToast("Erreur : " + err.message, 'error'); return; }
      closeModal();
      showToast("Inventaire abandonné.", 'info');
      if(currentServanteId === servanteId) setTimeout(()=>renderServanteDetail(servanteId), 250);
    }, { title:'Abandonner l\'inventaire', confirmLabel:'Abandonner', danger:true });
  });

  // --- terminer
  function validate(){
    if(!invData.realiseFonction){
      return { ok:false, msg:"Indiquez la fonction (magasinier ou brigadier) de la personne qui réalise l'inventaire : bouton « Modifier » en haut de cette fenêtre.", first:null, filter:activeFilter };
    }
    const nonPointes = state.resultats.filter(r => !r.resultat);
    if(nonPointes.length){
      return { ok:false, msg:`${nonPointes.length} outil${nonPointes.length>1?'s':''} non pointé${nonPointes.length>1?'s':''}. Pointez-les, ou utilisez « Marquer Conforme tout ce qui reste ».`, first: nonPointes[0].localId, filter:'todo' };
    }
    const sansQte = state.resultats.filter(r => r.quantiteAttendue > 1 && r.resultat !== 'Conforme' && (r.quantiteTrouvee === null || r.quantiteTrouvee === undefined));
    if(sansQte.length){
      return { ok:false, msg:`${sansQte.length} outil${sansQte.length>1?'s':''} en plusieurs exemplaires : indiquez combien de pièces sont conformes.`, first: sansQte[0].localId, filter:'ecarts' };
    }
    const tropSans = state.enTrop.filter(e => !(e.designation||'').trim());
    if(tropSans.length){
      return { ok:false, msg:"Un outil en trop n'a pas de désignation. Renseignez-la ou supprimez la ligne.", first:null, filter:'all' };
    }
    return { ok:true };
  }
  $('#inv-finish').addEventListener('click', ()=>{
    showError('');
    const v = validate();
    if(!v.ok){
      showError(v.msg);
      activeFilter = v.filter;
      document.querySelectorAll('.inv-chip').forEach(x => x.classList.toggle('on', x.dataset.filter === v.filter));
      applyFilter();
      if(v.first){ const row = $(`[data-row="${v.first}"]`); if(row){ row.scrollIntoView({ block:'center', behavior:'smooth' }); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'), 2000); } }
      return;
    }
    const n = (x) => state.resultats.filter(r => r.resultat === x).length;
    const box = $('#inv-confirm');
    box.style.display = 'block';
    box.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;">Récapitulatif avant clôture</div>
      <div style="font-size:13.5px;line-height:1.7;">
        ${state.resultats.length} outils pointés : <b style="color:#00863f;">${n('Conforme') - state.resultats.filter(r => r.retire).length} conformes</b>${state.resultats.some(r => r.retire) ? ` · <b>${state.resultats.filter(r => r.retire).length} hors dotation</b>` : ''}${n('Manquant')?` · <b style="color:#d64545;">${n('Manquant')} perdu${n('Manquant')>1?'s':''}</b>`:''}${n('Cassé')?` · <b style="color:#d64545;">${n('Cassé')} cassé${n('Cassé')>1?'s':''}</b>`:''}${n('Usé')?` · <b style="color:#8f6412;">${n('Usé')} usé${n('Usé')>1?'s':''}</b>`:''}
        ${state.enTrop.length ? `<br><b>${state.enTrop.length} outil${state.enTrop.length>1?'s':''} trouvé${state.enTrop.length>1?'s':''} en plus</b> (ajouté${state.enTrop.length>1?'s':''} à la dotation si la case est cochée, et au catalogue s'il est nouveau)` : ''}${state.resultats.some(r => r.quantiteOrig !== undefined) ? `<br><b>${state.resultats.filter(r => r.quantiteOrig !== undefined).length} quantité${state.resultats.filter(r => r.quantiteOrig !== undefined).length>1?'s':''} attendue${state.resultats.filter(r => r.quantiteOrig !== undefined).length>1?'s':''} corrigée${state.resultats.filter(r => r.quantiteOrig !== undefined).length>1?'s':''}</b>` : ''}
      </div>
      <p style="font-size:12px;color:var(--steel);margin:8px 0;">Une fois clôturé, vous téléchargez le PDF, vous le faites signer, puis vous envoyez le scan : l'inventaire est alors archivé et les écarts sont enregistrés.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" id="inv-back">Retour</button>
        <button type="button" class="btn btn-primary" id="inv-confirm-btn">Clôturer et télécharger le PDF</button>
      </div>`;
    box.scrollIntoView({ block:'center', behavior:'smooth' });
    $('#inv-back').addEventListener('click', ()=>{ box.style.display = 'none'; });
    $('#inv-confirm-btn').addEventListener('click', async ()=>{
      const btn = $('#inv-confirm-btn'); btn.disabled = true; btn.textContent = 'Clôture…';
      clearTimeout(saveTimer);
      try{
        const fin = updateDoc(doc(db,'inventaires',invId), {
          resultats: state.resultats, enTrop: state.enTrop,
          brouillon: false, dateInventaire: dateInputToIso(state.date), termineLe: nowIso(),
          cloturePar: `${currentUser.prenom} ${currentUser.nom}`, clotureParMatricule: currentUser.matricule
        });
        if(navigator.onLine) await fin; else fin.catch(()=>{});
        closeModal();
        if(currentServanteId === servanteId) setTimeout(()=>renderServanteDetail(servanteId), 250);
        if(navigator.onLine){
          showToast("Inventaire clôturé : le PDF à faire signer est téléchargé. Après signature, envoyez le scan.", 'success');
          downloadInventairePDF(invId, servanteId);
        } else showToast("Inventaire clôturé sur cet appareil. Il sera envoyé automatiquement au retour du réseau.", 'success');
      }catch(err){
        btn.disabled = false; btn.textContent = 'Clôturer et télécharger le PDF';
        showError("Erreur lors de la clôture : " + err.message);
      }
    });
  });

  // --- indicateur de connexion
  const majReseau = ()=>{ const b = $('#inv-offline'); if(b) b.style.display = navigator.onLine ? 'none' : 'block'; };
  window.addEventListener('online', majReseau); window.addEventListener('offline', majReseau);
  majReseau();

  // --- initialisation de l'affichage
  drawTrop();
  state.resultats.forEach(r => { refreshRow(r.localId); const ta = $(`[data-comment="${r.localId}"]`); if(ta) ta.value = r.commentaire || ''; });
  refreshProgress();
  if(majDotation){
    scheduleSave();
    showToast(`${majDotation} outil${majDotation>1?'s':''} ajouté${majDotation>1?'s':''} à la servante depuis le début de l'inventaire : ${majDotation>1?'ils sont':'il est'} dans la liste (à pointer).`, 'info');
  }
  if(opts.focusLocal){
    const rowF = $(`[data-row="${opts.focusLocal}"]`);
    if(rowF){ rowF.scrollIntoView({ block:'center' }); rowF.classList.add('flash'); setTimeout(()=>rowF.classList.remove('flash'), 2500); }
    showToast("Outil ajouté en haut de la liste.", 'success');
  }
  if(opts.focusCode){
    const code = String(opts.focusCode).trim().toLowerCase();
    const hit = state.resultats.find(r => String(r.reference||'').trim().toLowerCase() === code)
             || state.resultats.find(r => code.includes(String(r.reference||'').trim().toLowerCase()) && String(r.reference||'').trim().length >= 3);
    if(hit){
      const row = $(`[data-row="${hit.localId}"]`);
      if(row){ row.scrollIntoView({ block:'center' }); row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'), 2500); }
      showToast(`Outil repéré : ${hit.designation}`, 'success');
    } else {
      showToast(`Aucun outil de cette servante ne correspond au code « ${opts.focusCode} ».`, 'warning');
    }
  }
}

async function validerInventaireAgent(inventaireId, servanteId){
  try{
    await updateDoc(doc(db,'inventaires',inventaireId), {
      valideParAgent: true,
