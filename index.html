/* Retrouve un outil au catalogue (référence ou désignation identique), sinon le crée. Renvoie son identifiant (ou null). */
async function resoudreOuCreerOutil(e, inventaireId){
  if(e.outilId) return e.outilId;
  const norm = v => String(v || '').replace(/[\s.]+/g, '').toUpperCase();
  const nr = norm(e.reference), nd = norm(e.designation);
  const ex = outilsCache.find(x => (nr && norm(x.reference) === nr) || (!nr && nd && norm(x.designation) === nd));
  if(ex) return ex.id;
  try{
    const cat = categoriesCache.some(c => c.nom === e.categorie) ? e.categorie : 'Accessoires';
    const nouveau = await addDoc(collection(db,'outils'), {
      reference: sanitizeInput(String(e.reference || '')).toUpperCase(), designation: sanitizeInput(String(e.designation || '')).toUpperCase(),
      categorie: cat, sousCategorie: '', fabricant: '', photoUrl: e.photoUrl || null, quantiteStandard: 1,
      createdAt: nowIso(), ajouteParInventaire: inventaireId
    });
    outilsCache.push({ id: nouveau.id, reference: String(e.reference || '').toUpperCase(), designation: String(e.designation || '').toUpperCase(), categorie: cat });
    return nouveau.id;
  }catch(errCat){ return null; }   // droits insuffisants : l'outil reste ajouté à la servante seulement
}

/* Applique les écarts d'un inventaire : sorties de dotation, mouvements, date du dernier inventaire. */
async function appliquerEcartsInventaire(inv, inventaireId, servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
    const nonConformes = (inv.resultats||[]).filter(r=>r.resultat!=='Conforme');
    const typeMap = { 'Manquant':'manquant', 'Cassé':'casse', 'Usé':'usure' };

    let newOutilsAssignes = (s.outilsAssignes||[]);
    let dotationChangee = false;
    // quantités attendues corrigées pendant l'inventaire
    for(const r of (inv.resultats||[])){
      if(r.quantiteOrig !== undefined && r.quantiteOrig !== r.quantiteAttendue && !r.retire){
        newOutilsAssignes = newOutilsAssignes.map(t => t.localId===r.localId ? {...t, quantite: r.quantiteAttendue} : t);
        dotationChangee = true;
        await logMouvement({
          quantite: r.quantiteAttendue, servanteId, outilId: r.outilId || null, reference: r.reference || '—', designation: r.designation,
          type: 'correction_quantite', inventaireId,
          motif: `Quantité corrigée de ${r.quantiteOrig} à ${r.quantiteAttendue} lors de l'inventaire du ${formatDate(inv.dateInventaire)}`
        }, { preValide: true });
      }
    }
    // outils ajoutés pendant l'inventaire : ils entrent dans la dotation (et au catalogue s'ils n'y étaient pas)
    for(const r of (inv.resultats||[]).filter(x => x.ajoute && !x.retire)){
      const oid = await resoudreOuCreerOutil({ outilId: r.outilId, reference: r.reference, designation: r.designation, categorie: r.categorieNouvelle || r.categorie, photoUrl: r.photoUrl }, inventaireId);
      const o = outilsCache.find(x => x.id === oid) || {};
      const iAncien = oid ? newOutilsAssignes.findIndex(t => t.outilId === oid) : -1;
      const entree = { localId: r.localId, outilId: oid, reference: r.reference || '—', designation: r.designation, categorie: o.categorie || r.categorie || '',
                       groupe: o.groupe || '', ordre: o.ordre || 0, quantite: r.quantiteAttendue || 1, numeroSerie: '', dateAttribution: nowIso(), actif: true, etat: 'En service' };
      if(iAncien >= 0) newOutilsAssignes = newOutilsAssignes.map((t, i) => i === iAncien ? { ...t, ...entree } : t);
      else newOutilsAssignes = [...newOutilsAssignes, entree];
      dotationChangee = true;
      await logMouvement({
        quantite: r.quantiteAttendue || 1, servanteId, outilId: oid, reference: r.reference || '—', designation: r.designation,
        type: 'attribution', inventaireId,
        motif: `Ajouté à la dotation lors de l'inventaire du ${formatDate(inv.dateInventaire)}`
      }, { preValide: true });
    }
    // outils que l'agent n'a pas : retirés de la dotation (sans être des écarts)
    for(const r of (inv.resultats||[]).filter(x => x.retire)){
      newOutilsAssignes = newOutilsAssignes.map(t => t.localId===r.localId ? {...t, actif:false, etat:'Hors dotation'} : t);
      dotationChangee = true;
      await logMouvement({
        quantite: r.quantiteOrig !== undefined ? r.quantiteOrig : (r.quantiteAttendue || 1), servanteId, outilId: r.outilId || null, reference: r.reference || '—', designation: r.designation,
        type: 'retire_dotation', inventaireId,
        motif: `Retiré de la dotation lors de l'inventaire du ${formatDate(inv.dateInventaire)} (l'agent ne possède pas cet outil)`
      }, { preValide: true });
    }
    for(const r of nonConformes){
      const attendue = r.quantiteAttendue || 1;
      const trouvee = Math.max(0, Math.min(attendue, Number.isFinite(r.quantiteTrouvee) ? r.quantiteTrouvee : 0));
      const enEcart = attendue - trouvee;
      if(trouvee > 0 && enEcart > 0){
        // une partie seulement est en écart : le reste reste en service
        newOutilsAssignes = newOutilsAssignes.map(t => t.localId===r.localId ? {...t, quantite: trouvee} : t);
      } else {
        newOutilsAssignes = newOutilsAssignes.map(t => t.localId===r.localId ? {...t, actif:false, etat:r.resultat} : t);
      }
      await logMouvement({
        quantite: enEcart || attendue,
        servanteId, outilId: r.outilId, reference: r.reference, designation: r.designation,
        type: typeMap[r.resultat] || 'manquant',
        inventaireId,
        motif: `Constaté lors de l'inventaire du ${formatDate(inv.dateInventaire)}${r.commentaire ? ' — ' + r.commentaire : ''}`
      }, { preValide: true });
    }
    for(const e of (inv.enTrop||[])){
      if(e.ajouter === true){
        // l'agent possède cet outil : il entre dans la dotation de la servante
        const outilIdAj = await resoudreOuCreerOutil(e, inventaireId);
        const o = outilsCache.find(x => x.id === outilIdAj) || { categorie: e.categorie || '' };
        const q = Math.max(1, parseInt(e.quantite, 10) || 1);
        const iActif = outilIdAj ? newOutilsAssignes.findIndex(t => t.actif && t.outilId === outilIdAj) : -1;
        const iInactif = outilIdAj ? newOutilsAssignes.findIndex(t => !t.actif && t.outilId === outilIdAj) : -1;
        if(iActif >= 0) newOutilsAssignes = newOutilsAssignes.map((t, i) => i === iActif ? { ...t, quantite: (t.quantite||1) + q } : t);
        else if(iInactif >= 0) newOutilsAssignes = newOutilsAssignes.map((t, i) => i === iInactif ? { ...t, actif:true, etat:'En service', quantite:q, dateAttribution: nowIso() } : t);
        else newOutilsAssignes = [...newOutilsAssignes, {
          localId: uid(), outilId: outilIdAj, reference: e.reference || '—', designation: e.designation,
          categorie: o.categorie || '', groupe: o.groupe || '', ordre: o.ordre || 0, quantite: q, numeroSerie: '',
          dateAttribution: nowIso(), actif: true, etat: 'En service'
        }];
        dotationChangee = true;
        await logMouvement({
          quantite: q, servanteId, outilId: outilIdAj, reference: e.reference || '—', designation: e.designation,
          type: 'attribution', inventaireId,
          motif: `Ajouté à la dotation lors de l'inventaire du ${formatDate(inv.dateInventaire)}${e.commentaire ? ' — ' + e.commentaire : ''}`
        }, { preValide: true });
        continue;
      }
      await logMouvement({
        servanteId, outilId: e.outilId || null, reference: e.reference || '—', designation: e.designation,
        type: 'en_trop',
        inventaireId,
        motif: `Outil en trop trouvé lors de l'inventaire du ${formatDate(inv.dateInventaire)}${e.commentaire ? ' — ' + e.commentaire : ''}`
      }, { preValide: true });
    }
    // Pièces trouvées en plus de la dotation (ex. 3 trouvées pour 2 attendues) : consignées comme « en trop »
    for(const r of (inv.resultats||[])){
      const surplus = (Number.isFinite(r.quantiteTrouvee) ? r.quantiteTrouvee : 0) - (r.quantiteAttendue || 1);
      if(r.resultat === 'Conforme' && !r.retire && surplus > 0){
        await logMouvement({
          quantite: surplus, servanteId, outilId: r.outilId || null, reference: r.reference || '—', designation: r.designation,
          type: 'en_trop', inventaireId,
          motif: `${surplus} pièce${surplus>1?'s':''} en plus de la dotation, constatée${surplus>1?'s':''} lors de l'inventaire du ${formatDate(inv.dateInventaire)}`
        }, { preValide: true });
      }
    }
    if(dotationChangee || nonConformes.length){
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: newOutilsAssignes });
    }
    const datePrec = s.dernierInventaire && s.dernierInventaire.date;
  const plusRecent = !datePrec || new Date(inv.dateInventaire) >= new Date(datePrec);
  const servanteUpdate = { ...(plusRecent ? { dernierInventaire: { date: inv.dateInventaire, inventaireId } } : {}), prochainInventairePrevu: null };
    await updateDoc(doc(db,'servantes',servanteId), servanteUpdate);
  return servanteUpdate;
}

async function validerInventaireAdmin(inventaireId, servanteId){
  const s = servantesCache.find(x=>x.id===servanteId);
  try{
    const invSnap = await getDoc(doc(db,'inventaires',inventaireId));

/* ============ REMPLACEMENT, INDICATEURS, EXPORTS EXCEL ============ */
function mouvementARemplacer(m){
  return m.valideParAgent && m.valideParAdmin && !m.annule && ['casse','usure','manquant'].includes(m.type) && m.remplace !== true;
}
function piecesEnEcart(r){
  const att = r.quantiteAttendue || 1;
  if(r.resultat === 'Conforme') return 0;
  const ok = Math.max(0, Math.min(att, Number.isFinite(r.quantiteTrouvee) ? r.quantiteTrouvee : 0));
  return att - ok;
}

function calculerIndicateurs(){
  const valides = inventairesAllCache.filter(i => !i.brouillon && !i.annule && i.valideParAgent && i.valideParAdmin);
  let pointes = 0, ecarts = 0, enTrop = 0;
  const parGarage = {}, parOutil = {};
  valides.forEach(inv => {
    const sv = servantesCache.find(s=>s.id===inv.servanteId) || {};
    const g = sv.garage || inv.garage || 'Non renseigné';
    const p = parGarage[g] = parGarage[g] || { pointes:0, ecarts:0, inventaires:0 };
    p.inventaires++;
    (inv.resultats||[]).forEach(r => {
      const att = r.quantiteAttendue || 1;
      const bad = piecesEnEcart(r);
      pointes += att; ecarts += bad; p.pointes += att; p.ecarts += bad;
      if(bad > 0) parOutil[r.designation] = (parOutil[r.designation]||0) + bad;
    });
    enTrop += (inv.enTrop||[]).length;
  });
  const aRemplacer = mouvementsAllCache.filter(mouvementARemplacer);
  return {
    nbInventaires: valides.length, pointes, ecarts, enTrop,
    taux: pointes ? (pointes - ecarts) / pointes : null,
    parGarage: Object.entries(parGarage).map(([g,v]) => ({ garage:g, ...v, taux: v.pointes ? (v.pointes - v.ecarts)/v.pointes : null })).sort((a,b)=> (a.taux??1) - (b.taux??1)),
    topOutils: Object.entries(parOutil).sort((a,b)=>b[1]-a[1]).slice(0,5),
    nbARemplacer: aRemplacer.reduce((n,m)=> n + (m.quantite||1), 0)
  };
}
function indicateursHtml(){
  const k = calculerIndicateurs();
  const pct = (x) => x === null ? '—' : Math.round(x*100) + ' %';
  const couleur = (x) => x === null ? 'var(--steel)' : (x >= 0.95 ? '#00863f' : (x >= 0.85 ? '#8f6412' : '#d64545'));
  const tile = (label, value, color) => `<div class="panel" style="padding:14px 16px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);">${label}</div><div style="font-size:26px;font-weight:800;color:${color||'inherit'};margin-top:4px;">${value}</div></div>`;
  return `
    <div class="section-label">Indicateurs de conformité</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px;">
      ${tile('Taux de conformité', pct(k.taux), couleur(k.taux))}
      ${tile('Inventaires validés', k.nbInventaires)}
      ${tile('Pièces en écart', k.ecarts, k.ecarts ? '#d64545' : '')}
      ${tile('Outils en trop trouvés', k.enTrop)}
      ${tile('À remplacer', k.nbARemplacer + ' pièce' + (k.nbARemplacer>1?'s':''), k.nbARemplacer ? '#8f6412' : '')}
    </div>
    ${k.parGarage.length || k.topOutils.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:18px;">
      <div class="panel" style="padding:14px 16px;">
        <b style="font-size:13px;">Conformité par garage</b>
        ${k.parGarage.map(g => `
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);">
            <span>${escapeHtml(g.garage)} <span style="color:var(--steel);">(${g.inventaires} inv.)</span></span>
            <b style="color:${couleur(g.taux)};">${pct(g.taux)}</b>
          </div>`).join('') || '<p style="font-size:12.5px;color:var(--steel);">Aucun inventaire validé.</p>'}
      </div>
      <div class="panel" style="padding:14px 16px;">
        <b style="font-size:13px;">Outils les plus souvent en écart</b>
        ${k.topOutils.map(([n,c]) => `
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);">
            <span>${escapeHtml(n)}</span><b>${c}</b>
          </div>`).join('') || '<p style="font-size:12.5px;color:var(--steel);">Aucun écart.</p>'}
      </div>
    </div>` : ''}`;
}

async function exporterExcel(nomFichier, feuilles){
  try{
    const XLSX = await loadSheetJS();
    const wb = XLSX.utils.book_new();
    feuilles.forEach(f => {
      const ws = XLSX.utils.aoa_to_sheet([f.entetes, ...f.lignes]);
      ws['!cols'] = f.entetes.map((h,i)=>({ wch: Math.min(60, Math.max(String(h).length + 2, ...f.lignes.slice(0,200).map(l=>String(l[i] ?? '').length + 2))) }));
      XLSX.utils.book_append_sheet(wb, ws, f.nom.slice(0,31));
    });
    XLSX.writeFile(wb, nomFichier);
    showToast("Fichier Excel généré.", 'success');
  }catch(err){ showToast("Erreur lors de l'export : " + err.message, 'error'); }
}

function ouvrirRemplacement(mvtId){
  const m = mouvementsAllCache.find(x=>x.id===mvtId); if(!m) return;
  const s = servantesCache.find(x=>x.id===m.servanteId);
  const qte = m.quantite || 1;
  openModal(`
    <div class="modal-head"><h3>Marquer comme remplacé</h3><button class="modal-close" id="m-close">&times;</button></div>
    <p style="font-size:13px;color:var(--steel);margin-bottom:12px;"><b>${escapeHtml(m.designation||'')}</b> (${escapeHtml(m.reference||'')}) — ${qte} pièce${qte>1?'s':''} · ${escapeHtml((MVT_TYPES[m.type]||{label:m.type}).label)} le ${dateCourte(m.date)}</p>
    <div class="modal-error" id="rem-error"></div>
    <div class="checkbox-row" style="margin-bottom:10px;">
      <input type="checkbox" id="rem-reattribuer" ${s ? 'checked' : 'disabled'}>
      <label for="rem-reattribuer">Remettre ${qte>1?`les ${qte} pièces neuves`:'la pièce neuve'} en dotation dans la servante ${s ? '(n° ' + escapeHtml(s.agentMatricule||'—') + ')' : '(introuvable)'}</label>
    </div>
    <p style="font-size:12px;color:var(--steel);margin-bottom:12px;">Décochez si le remplacement a déjà été enregistré ailleurs : la ligne sera simplement retirée de la liste.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
      <button type="button" class="btn btn-primary" id="rem-ok">Confirmer</button>
    </div>`);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('rem-ok').addEventListener('click', async ()=>{
    const btn = document.getElementById('rem-ok'); btn.disabled = true;
    try{
      await updateDoc(doc(db,'mouvements',mvtId), {
        remplace: true, remplaceLe: nowIso(),
        remplaceParNom: `${currentUser.prenom} ${currentUser.nom}`, remplaceParMatricule: currentUser.matricule
      });
      if(document.getElementById('rem-reattribuer').checked && s){
        const outils = (s.outilsAssignes||[]).slice();
        const idx = outils.findIndex(t => t.actif && t.outilId === m.outilId);
        const idxSorti = outils.findIndex(t => !t.actif && m.outilId && t.outilId === m.outilId);
        if(idx >= 0) outils[idx] = { ...outils[idx], quantite: (outils[idx].quantite||1) + qte };
        else if(idxSorti >= 0) outils[idxSorti] = { ...outils[idxSorti], actif: true, etat: 'En service', quantite: qte, dateAttribution: nowIso() };
        else outils.push({ localId: uid(), outilId: m.outilId || null, reference: m.reference, designation: m.designation,
          categorie: (outilsCache.find(o=>o.id===m.outilId)||{}).categorie || '', quantite: qte, numeroSerie: '',
          dateAttribution: nowIso(), actif: true, etat: 'En service' });
        await updateDoc(doc(db,'servantes',s.id), { outilsAssignes: outils });
        await logMouvement({ servanteId: s.id, outilId: m.outilId || null, reference: m.reference, designation: m.designation,
          type: 'remplacement', quantite: qte, motif: `Remplacement suite à : ${(MVT_TYPES[m.type]||{label:m.type}).label} du ${dateCourte(m.date)}` }, { preValide: true });
      }
      closeModal();
      showToast("Remplacement enregistré.", 'success');
      if(currentView === 'journal') setTimeout(()=>renderJournalInventairesView(), 350);
    }catch(err){
      const e = document.getElementById('rem-error'); e.textContent = err.message; e.style.display = 'block'; btn.disabled = false;
    }
  });
}

/* ============ CORRECTIONS (mode test) ET ANNULATIONS MOTIVÉES ============
   - Avant validation : l'administrateur peut rouvrir ou supprimer.
   - Après validation, en production : « Annuler avec un motif » (l'élément reste
     dans l'historique, barré et expliqué, ses effets sont défaits).
   - Mode test (réglage Paramètres) : tout peut être rouvert ou supprimé pour tester. */
function legacyMouvementLie(m, inv){
  return !m.inventaireId && ['manquant','casse','usure','en_trop'].includes(m.type)
    && (m.motif||'').includes(formatDate(inv.dateInventaire));
}
function refreshAfterCorrection(servanteId){
  setTimeout(()=>{
    if(currentView === 'journal') renderJournalInventairesView();
    else if(servanteId && (currentServanteId === servanteId || currentUser.role === 'agent')) renderServanteDetail(servanteId);
  }, 400);
}
function demanderMotif(titre, intro, confirmLabel, onSubmit){
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(titre)}</h3><button class="modal-close" id="m-close">&times;</button></div>
    <p style="font-size:13px;color:var(--steel);margin-bottom:10px;">${intro}</p>
    <div class="modal-error" id="motif-error"></div>
    <div class="field"><label>Motif (obligatoire)</label>
      <textarea id="motif-text" rows="3" placeholder="Ex : erreur de saisie, mauvaise servante pointée…"></textarea></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="m-cancel">Retour</button>
      <button type="button" class="btn btn-danger" id="motif-ok">${escapeHtml(confirmLabel)}</button>
    </div>`);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('motif-ok').addEventListener('click', async ()=>{
    const motif = sanitizeInput(document.getElementById('motif-text').value);
    const err = document.getElementById('motif-error');
    if(motif.length < 5){ err.textContent = "Expliquez brièvement le motif (5 caractères minimum)."; err.style.display = 'block'; return; }
    try{ await onSubmit(motif); closeModal(); }
    catch(e){ err.textContent = e.message; err.style.display = 'block'; }
  });
}
const champsAnnulation = (motif) => ({
  annule: true, motifAnnulation: motif,
  annuleParNom: `${currentUser.prenom} ${currentUser.nom}`, annuleParMatricule: currentUser.matricule, annuleLe: nowIso()
});

// Défait les effets d'un inventaire validé : outils remis en service, mouvements liés supprimés (ou annulés), dernier inventaire recalculé.
async function annulerEffetsInventaire(inv, supprimerMouvements, motif){
  const servanteId = inv.servanteId;
  const s = servantesCache.find(x=>x.id===servanteId);
  if(s){
    const outils = (s.outilsAssignes||[]).map(t=>{
      const r = (inv.resultats||[]).find(x=>x.localId===t.localId && x.resultat && x.resultat!=='Conforme');
      if(!r) return t;
      const back = { ...t, actif:true, etat:'En service' };
      if(r.quantiteAttendue) back.quantite = r.quantiteAttendue;
      return back;
    });
    await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: outils });
  }
  const lies = mouvementsAllCache.filter(m => m.servanteId===servanteId && (m.inventaireId===inv.id || legacyMouvementLie(m, inv)));
  for(const m of lies){
    if(supprimerMouvements) await deleteDoc(doc(db,'mouvements',m.id));
    else await updateDoc(doc(db,'mouvements',m.id), champsAnnulation(motif || "Inventaire annulé"));
  }
  const autres = inventairesAllCache
    .filter(i => i.servanteId===servanteId && i.id!==inv.id && i.valideParAdmin && !i.brouillon && !i.annule)
    .sort((a,b)=> new Date(b.dateInventaire) - new Date(a.dateInventaire));
  await updateDoc(doc(db,'servantes',servanteId), {
    dernierInventaire: autres[0] ? { date: autres[0].dateInventaire, inventaireId: autres[0].id } : null
  });
}

function corrigerInventaireSupprimer(invId){
  const inv = inventairesAllCache.find(i=>i.id===invId); if(!inv) return;
  const valide = inv.valideParAdmin === true;
  if(valide && !modeTestActif()){
    demanderMotif("Annuler cet inventaire",
      "Cet inventaire est <b>validé</b>. Il restera dans l'historique, barré, avec votre motif. Ses effets seront défaits : outils remis en service, mouvements liés annulés.",
      "Annuler l'inventaire", async (motif)=>{
        await annulerEffetsInventaire(inv, false, motif);
        await updateDoc(doc(db,'inventaires',invId), champsAnnulation(motif));
        showToast("Inventaire annulé.", 'success');
        refreshAfterCorrection(inv.servanteId);
      });
    return;
  }
  showConfirmModal(valide
      ? "Cet inventaire est validé. Le supprimer annulera aussi ses effets (outils remis en service, mouvements liés supprimés). Continuer ?"
      : "Supprimer définitivement cet inventaire ?", async ()=>{
    try{
      if(valide) await annulerEffetsInventaire(inv, true);
      await deleteDoc(doc(db,'inventaires',invId));
      showToast("Inventaire supprimé.", 'success');
    }catch(err){ showToast("Erreur : " + err.message, 'error'); }
    refreshAfterCorrection(inv.servanteId);
  }, { title:"Supprimer l'inventaire", confirmLabel:'Supprimer', danger:true });
}

function corrigerInventaireRouvrir(invId){
  const inv = inventairesAllCache.find(i=>i.id===invId); if(!inv) return;
  const valide = inv.valideParAdmin === true;
  if(valide && !modeTestActif()){
    showToast("Un inventaire validé ne peut plus être rouvert. Annulez-le avec un motif, puis refaites-le.", 'warning'); return;
  }
  const draft = findDraftInventaire(inv.servanteId);
  if(draft && draft.id !== invId){
    showToast("Un inventaire est déjà en cours pour cette servante : terminez-le ou abandonnez-le d'abord.", 'warning'); return;
  }
  showConfirmModal(valide
      ? "Rouvrir cet inventaire validé pour le corriger ? Ses effets seront défaits et les validations retirées."
      : "Rouvrir cet inventaire pour le corriger ? Les validations déjà données seront retirées.", async ()=>{
    try{
      if(valide) await annulerEffetsInventaire(inv, true);
      const reset = {
        brouillon:true, termineLe:null,
        valideParAgent:false, valideParAgentMatricule:null, valideParAgentNom:null, valideParAgentLe:null,
        valideParAdmin:false, valideParAdminMatricule:null, valideParAdminNom:null, valideParAdminLe:null
      };
      await updateDoc(doc(db,'inventaires',invId), reset);
      openInventaireEditor(inv.servanteId, invId, { ...inv, ...reset });
    }catch(err){ showToast("Erreur : " + err.message, 'error'); }
  }, { title:"Rouvrir l'inventaire", confirmLabel:'Rouvrir', danger:false });
}

function corrigerMouvementSupprimer(mvtId){
  const m = mouvementsAllCache.find(x=>x.id===mvtId); if(!m) return;
  const valide = m.valideParAdmin === true;
  if(valide && !modeTestActif()){
    demanderMotif("Annuler ce mouvement",

      "Annuler le mouvement", async (motif)=>{
        await updateDoc(doc(db,'mouvements',mvtId), champsAnnulation(motif));

    catch(err){ showToast("Erreur : " + err.message, 'error'); }

}

function corrigerServanteSupprimer(servanteId){
  const s = servantesCache.find(x=>x.id===servanteId); if(!s) return;
  showConfirmModal(`Supprimer la servante n° ${s.agentMatricule || '—'} (${s.agentNom || 'disponible'}) avec TOUS ses inventaires et mouvements ? Cette action est irréversible (mode test).`, async ()=>{

      for(const i of inventairesAllCache.filter(x=>x.servanteId===servanteId)) await deleteDoc(doc(db,'inventaires',i.id));

      });

async function chargerModele(servanteId){
  if(!modeleDotationCache || !modeleDotationCache.outils || !modeleDotationCache.outils.length){
    showToast("Aucun modèle de dotation type n'a encore été enregistré.", 'warning');
    return;
  }
  const s = servantesCache.find(x=>x.id===servanteId);
  const existingIds = new Set((s.outilsAssignes||[]).filter(t=>t.actif).map(t=>t.outilId));
  const aAjouter = modeleDotationCache.outils.filter(t => !existingIds.has(t.outilId));
  if(!aAjouter.length){
    showToast("Tous les outils du modèle sont déjà présents dans cette servante.", 'info');
    return;
  }
  showConfirmModal(`Ajouter les ${aAjouter.length} outils manquants du modèle à cette servante ?`, async ()=>{
    try{
      const newEntries = aAjouter.map(t => ({
        localId: uid(), outilId: t.outilId, reference: t.reference, designation: t.designation, categorie: t.categorie,
        dateAttribution: nowIso(), actif: true, etat: 'En service'
      }));
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: [...(s.outilsAssignes||[]), ...newEntries] });
      for(const t of aAjouter){
        await logMouvement({ servanteId, outilId: t.outilId, reference: t.reference, designation: t.designation, type: 'attribution', motif: 'Ajouté depuis le modèle de dotation type' });
      }
      showToast(`${aAjouter.length} outil(s) ajouté(s) depuis le modèle.`, 'success');
    }catch(err){
      showToast("Erreur : " + err.message, 'error');
    }
  }, { title:'Charger le modèle', confirmLabel:'Ajouter', danger:false });
}

/* Une ligne de dotation à partir d'une fiche du catalogue (quantité standard comprise) */
function entreeDotation(o){
  return {
    localId: uid(), outilId: o.id, reference: o.reference, designation: o.designation, categorie: o.categorie || '',
    groupe: o.groupe || '', ordre: o.ordre || 0, quantite: Math.max(1, o.quantiteStandard || 1), numeroSerie: '',
    dateAttribution: nowIso(), actif: true, etat: 'En service'
  };
}

/* Charge tout le catalogue sur une servante : UN enregistrement + UNE ligne d'historique (plus de validation outil par outil). */
async function attribuerToutLeCatalogue(servanteId){
  if(!outilsCache.length){
    showToast("Le catalogue d'outils est vide.", 'warning');
    return;
  }
  const s = servantesCache.find(x=>x.id===servanteId);
  const dejaLa = new Set((s.outilsAssignes||[]).map(t=>t.outilId));   // actifs ET sortis : on ne les remet pas d'office
  const aAjouter = outilsCache.filter(o => !dejaLa.has(o.id));
  if(!aAjouter.length){
    showToast("Tous les outils du catalogue sont déjà sur cette servante.", 'info');
    return;
  }
  showConfirmModal(`Charger les ${aAjouter.length} outils du catalogue sur cette servante ?`, async ()=>{
    try{
      const newEntries = aAjouter.map(entreeDotation);
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: [...(s.outilsAssignes||[]), ...newEntries] });
      await logMouvement({
        servanteId, outilId: null, reference: '—', designation: `Catalogue complet (${aAjouter.length} références)`,
        type: 'attribution', quantite: aAjouter.length, motif: 'Chargement du catalogue complet sur la servante'
      }, { preValide: true });
      showToast(`${aAjouter.length} outils chargés sur la servante.`, 'success');
    }catch(err){
      showToast("Erreur : " + err.message, 'error');
    }
  }, { title:'Charger le catalogue complet', confirmLabel:'Charger', danger:false });
}

          document.getElementById('assign-outil').value = match.id;
        } else if(errEl){
          errEl.textContent = `Aucun outil du catalogue ne correspond au code « ${code} ».`;
          errEl.style.display = 'block';
        }
      }, 0);
    });
  });
  document.getElementById('assign-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('assign-modal-error');
    const outilId = document.getElementById('assign-outil').value;
    if(!outilId){ errEl.textContent = "Veuillez choisir un outil."; errEl.style.display='block'; return; }
    const outil = outilsCache.find(o=>o.id===outilId);
    const s = servantesCache.find(x=>x.id===servanteId);
    const localId = uid();
    const qteAttr = Math.max(1, parseInt(document.getElementById('assign-qte').value, 10) || 1);
    const entry = {
      localId, outilId, reference: outil.reference, designation: outil.designation, categorie: outil.categorie,
      quantite: qteAttr, numeroSerie: sanitizeInput(document.getElementById('assign-serie').value),
      dateAttribution: nowIso(), actif: true, etat: 'En service'
    };
    try{
      const updated = [...(s.outilsAssignes||[]), entry];
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: updated });
      await logMouvement({
        servanteId, outilId, reference: outil.reference, designation: outil.designation,
        type: 'attribution', quantite: qteAttr, motif: ''
      });
      closeModal();
    }catch(err){
      errEl.textContent = err.message; errEl.style.display='block';
    }
  });
}

function openSignalerOutilModal(servanteId, localId){
  const s = servantesCache.find(x=>x.id===servanteId); if(!s) return;
  const t = (s.outilsAssignes||[]).find(x=>x.localId===localId); if(!t) return;
  const choix = [
    ['casse','Cassé','btn-danger'], ['manquant','Perdu','btn-danger'], ['usure','Usé','btn-secondary'],
    ['echange','Échanger contre un autre outil','btn-secondary'], ['retour','Retour au magasin','btn-secondary'], ['plus_necessaire','Plus nécessaire','btn-secondary']
  ];
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(t.designation)}</h3><button class="modal-close" id="m-close">&times;</button></div>
    <p style="font-size:12.5px;color:var(--steel);margin-bottom:14px;">${escapeHtml(t.reference)} — que s'est-il passé ?</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${choix.map(c => `<button class="btn ${c[2]}" data-choix="${c[0]}" style="justify-content:center;padding:12px;">${c[1]}</button>`).join('')}
    </div>
    <div class="modal-actions"><button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button></div>`);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.querySelectorAll('[data-choix]').forEach(b => b.addEventListener('click', ()=>{
    closeModal();
    setTimeout(()=>openMouvementModal(servanteId, localId, b.dataset.choix), 50);
  }));
}

function openMouvementModal(servanteId, localId, type){
  const s = servantesCache.find(x=>x.id===servanteId);
  const tool = (s.outilsAssignes||[]).find(t=>t.localId===localId);
  const info = MVT_TYPES[type];
  const needsReplacement = type === 'echange';
  const byCategory = {};
  outilsCache.forEach(o=>{
    if(!byCategory[o.categorie]) byCategory[o.categorie] = [];
    byCategory[o.categorie].push(o);
  });
  const options = Object.keys(byCategory).sort().map(cat => `
    <optgroup label="${escapeHtml(cat)}">
      ${byCategory[cat].sort((a,b)=>a.designation.localeCompare(b.designation)).map(o=>`<option value="${o.id}">${escapeHtml(o.designation)} (${escapeHtml(o.reference)})</option>`).join('')}
    </optgroup>`).join('');

  openModal(`
    <div class="modal-head"><h3>${escapeHtml(info.label)} — ${escapeHtml(tool.designation)}</h3><button class="modal-close" id="m-close">&times;</button></div>
    <div class="modal-error" id="mvt-modal-error"></div>
    <form id="mvt-form">
      <p style="font-size:13px;color:var(--steel);margin-bottom:14px;">${escapeHtml(tool.reference)} · en dotation depuis le ${formatDate(tool.dateAttribution)}</p>
      ${(tool.quantite||1) > 1 ? `
      <div class="field"><label>Quantité concernée (sur ${tool.quantite})</label>
        <input type="number" id="mvt-qte" min="1" max="${tool.quantite}" step="1" value="${tool.quantite}"></div>` : ''}
      ${needsReplacement ? `
      <div class="field">
        <label>Nouvel outil de remplacement</label>
        <select id="mvt-nouvel-outil" required>
          <option value="">Sélectionner un outil…</option>
          ${options}
        </select>
      </div>` : ''}
      <div class="field">
        <label>Motif${needsReplacement?'':' (optionnel)'}</label>
        <textarea id="mvt-motif" rows="3" placeholder="Précisez la raison de ce mouvement…" ${needsReplacement?'required':''}></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="m-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Confirmer</button>
      </div>
    </form>
  `);
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('mvt-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('mvt-modal-error');
    const motif = sanitizeInput(document.getElementById('mvt-motif').value);
    try{
      const total = tool.quantite || 1;
      const qteEl = document.getElementById('mvt-qte');
      const qteMvt = qteEl ? Math.min(total, Math.max(1, parseInt(qteEl.value, 10) || total)) : total;
      let newOutilsAssignes = (s.outilsAssignes||[]).map(t=>{
        if(t.localId !== localId) return t;
        if(qteMvt < total) return { ...t, quantite: total - qteMvt };   // une partie seulement : le reste reste en service
        return { ...t, actif:false, etat: info.label };
      });
      let mvtPayload = {
        servanteId, outilId: tool.outilId, reference: tool.reference, designation: tool.designation,
        type, quantite: qteMvt, motif
      };
      if(needsReplacement){
        const newOutilId = document.getElementById('mvt-nouvel-outil').value;
        if(!newOutilId){ throw new Error("Veuillez choisir l'outil de remplacement."); }
        const newOutil = outilsCache.find(o=>o.id===newOutilId);
        const newEntry = {
          localId: uid(), outilId: newOutil.id, reference: newOutil.reference, designation: newOutil.designation,
          categorie: newOutil.categorie, quantite: qteMvt, numeroSerie: '', dateAttribution: nowIso(), actif:true, etat:'En service'
        };
        newOutilsAssignes = [...newOutilsAssignes, newEntry];
        mvtPayload.ancienOutilId = tool.outilId;
        mvtPayload.ancienReference = tool.reference;
        mvtPayload.nouvelOutilId = newOutil.id;
        mvtPayload.nouvelleReference = newOutil.reference;
      }
      await updateDoc(doc(db,'servantes',servanteId), { outilsAssignes: newOutilsAssignes });
      await logMouvement(mvtPayload);
      closeModal();
    }catch(err){
      errEl.textContent = err.message; errEl.style.display = 'block';
    }
  });
}

</script>
</body>
